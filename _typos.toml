[files]
extend-exclude = [
  "*.thy",
  "*.vimp",
  "pixi.lock",
  "codegen/generated/",
  "docs/generated/",
  "docs/history/",
  "thesis/shared/generated/",
  "thesis/lib/isabelle-symbols.typ",
  "vendor/",
]

[default]
# The thesis carries a German title alongside the English one. A playground
# link's #code= fragment is a compressed program in base64url.
extend-ignore-re = ["title-de: .*", "#code=[A-Za-z0-9_-]+"]

[default.extend-words]
# Isabelle's theorem keyword and antiquotation.
thm = "thm"
# The TD solver's set of stable unknowns.
stabl = "stabl"
# g2html's dead-line attribute in the report XML.
ded = "ded"
# Cytoscape.js option naming the elements to fit or center on.
eles = "eles"
# The concretization parameter of gamma_lift in Reachability_Lift.thy.
gam = "gam"
# First-name fragment of Ondřej Lhoták, written Ond{\v{r}}ej in BibTeX.
Ond = "Ond"
# lits_fit in VIMP_Expr.thy: every literal of an expression fits I64.
lits = "lits"
# gret_store, the retired generic return-store update, recorded in theorem-migration.toml.
gret = "gret"
