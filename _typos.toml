[files]
extend-exclude = [
  "*.thy",
  "*.vimp",
  "pixi.lock",
  "codegen/generated/",
  "docs/generated/",
  "docs/history/",
  "thesis/shared/generated/",
  "thesis/lib/isabelle-symbols.typ",
  "vendor/",
  "paper/lipics/",
  "paper/sty/",
  "paper/reviews/*/submission.txt",
]

[default]
# The thesis carries a German title alongside the English one.
extend-ignore-re = ["title-de: .*"]

[default.extend-words]
# Isabelle's theorem keyword and antiquotation.
thm = "thm"
# The TD solver's set of stable unknowns.
stabl = "stabl"
# g2html's dead-line attribute in the report XML.
ded = "ded"
# Cytoscape.js option naming the elements to fit or center on.
eles = "eles"
# The concretization parameter of gamma_lift in Reachability_Lift.thy.
gam = "gam"
# First-name fragment of Ondřej Lhoták, written Ond{\v{r}}ej in BibTeX.
Ond = "Ond"
# BibTeX's free-text annotation field, read by paper/tools/bib.py.
annote = "annote"
# amsmath's multline environment, used by the paper and named in the Vale TeX ignores.
multline = "multline"
