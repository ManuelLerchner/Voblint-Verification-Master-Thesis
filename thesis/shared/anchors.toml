# The formalization anchor index (appendix B): one row per concept the thesis
# explains, with the Isabelle item that defines or proves it. Only the concept
# is typed here. The theory column is read from the verified link map, so it
# cannot name a theory the item has left; `thesis-refs` checks that each item
# exists with the stated kind and `thesis-links` that it has an anchor.
#
# [[anchor]]
#   chapter  label of the chapter that explains the concept
#   concept  what a reader looks the item up by
#   kind     const | thm | type | locale
#   name     the Isabelle name
#   thy      its theory, when several theories define the name

