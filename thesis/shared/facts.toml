# Theorem statements the thesis reproduces. Exported from a built session
# rather than retyped, so the page shows what Isabelle actually proved.
#
# `session` names the heap the export runs against and `theory` the context
# facts are resolved in; both must be built. Facts from other sessions are
# reported as unresolved rather than silently dropped.

session = "Voblint_CLI"
theory = "Voblint_CLI.Run_Voblint"

[facts.run_voblint_source_sound]
why = "The introduction states the source-level soundness result with its actual premises."

[facts.run_voblint_spine]
why = "Results chapter: a source run's trace, its context and the chain to the verdicts, once for every policy."

[facts.run_voblint_report_contract]
why = "Results chapter: what an analysed answer guarantees about its report."

[facts.run_voblint_check_sound]
why = "Check-verdict endpoint cited in the introduction."

[facts.run_voblint_dead_unreached]
why = "Unreachability endpoint cited in the introduction."

[facts.run_voblint_arithmetic_safe]
why = "Arithmetic-safety endpoint cited in the introduction."

[facts.source_run_has_activation_trace]
why = "Main-statements appendix: source runs are represented by valid traces."
fact = "bridge_sem.source_run_has_activation_trace"
session = "Voblint_Compile"
theory = "Voblint_Compile.Source_To_Trace"

[facts.csim_step]
why = "Program-model chapter: one source step is matched by the compiled graph."

[facts.source_progress]
why = "Program-model chapter: reachable configurations of a well-formed program are finished or can step."
session = "Voblint_Compile"
theory = "Voblint_Compile.Source_Progress"

[facts.csim_star]
why = "Main-statements appendix: simulation of source runs by the compiled graph."

[facts.gactivation_collect_sound]
why = "Main-statements appendix: the activation coverage theorem."
fact = "collect_sem.gactivation_collect_sound"
session = "Voblint_Framework"
theory = "Voblint_Framework.Activation_Backbone"

[facts.activation_collect_dg_sound]
why = "Main-statements appendix: a solved D/G table satisfies the coverage obligations."
fact = "grouted_context.activation_collect_dg_sound"

[facts.nv_source_certified]
why = "Non-vacuity section of the evaluation: the endpoint's premises hold for one program."
session = "Voblint_Examples"
theory = "Voblint_Examples.Example_Non_Vacuity"

[facts."gpstep.Call"]
why = "Program-model chapter: the source step rule for a call."

[facts."gpstep.ReturnSome"]
why = "Program-model chapter: the source step rule for returning a value."

[facts."gpstep.RestoreStep"]
why = "Program-model chapter: the source step rule that restores the caller's frame."

[facts."gpstep.UnwindAct"]
why = "Program-model chapter: the source step rule that pops the caller's frame after an explicit return."

[facts."compile.simps(4)"]
why = "Program-model chapter: compiling a sequence hands the first command the second's entry."

[facts."compile.simps(5)"]
why = "Program-model chapter: both branches of a conditional compile against one continuation."

[facts."compile.simps(6)"]
why = "Program-model chapter: a loop body compiles against the loop head."

[facts."compile.simps(8)"]
why = "Program-model chapter: a return edge targets the procedure's result node."

[facts.return_at_caller_context_unsound]
why = "Chapter 4: reading the callee result at the caller context is unsound."
session = "Voblint_Examples"
theory = "Voblint_Examples.Example_Non_Vacuity"

[facts.total_dropped_unsound]
why = "Chapter 4: dropping TOTAL is unsound."
session = "Voblint_Examples"
theory = "Voblint_Examples.Example_Non_Vacuity"

[facts.source_reaches_node_collect]
why = "Chapter 4: source-reachable stores are collected."
session = "Voblint_Compile"
theory = "Voblint_Compile.Source_To_Trace"

[facts.node_collect_eq_Union_activation_collect]
why = "Chapter 4: exhaustive buckets under the coverage contract."
fact = "gactivation_coverage.node_collect_eq_Union_activation_collect"
session = "Voblint_CFG"
theory = "Voblint_CFG.Activation_Trace_Abstract"

[facts.node_collect_covered]
why = "Chapter 4: the claims of all contexts contain the node collecting semantics."
fact = "gactivation_coverage.node_collect_covered"
session = "Voblint_CFG"
theory = "Voblint_CFG.Activation_Trace_Abstract"

[facts.cstep_preserves_activation_trace_repr]
why = "Chapter 4: one graph step is matched by a trace rule."
session = "Voblint_Compile"
theory = "Voblint_Compile.Source_To_Trace"

[facts.ls_channel_sound]
why = "Cooperation chapter: the channel the framework supplies holds at every store of the state."
session = "Voblint_Framework"
theory = "Voblint_Framework.MCP_Spec"

[facts.mcp_combine_sound]
why = "Cooperation chapter: independent sound components combine into a sound component."
session = "Voblint_Framework"
theory = "Voblint_Framework.MCP_Spec"

[facts.routed_node_rhs_parts]
why = "Chapter 8, interprocedural equations: the schematic right-hand side is the generator's answer at every valuation."
session = "Voblint_Framework"
theory = "Voblint_Framework.DG_Indexed_Generator"

[facts.routed_node_rhs_buffered_parts]
why = "Chapter 8, interprocedural equations: the executed buffered generator answers the same join of parts as the reference generator."
session = "Voblint_Framework"
theory = "Voblint_Framework.DG_Indexed_Generator"

[facts.nonrel_refine_sound]
why = "Chapter 5, the guard refinement drops no store that passes the guard."
session = "Voblint_Nonrelational"
theory = "Voblint_Nonrelational.Nonrelational_Transfer"
