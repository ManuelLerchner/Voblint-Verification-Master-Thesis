# Explanatory SVGs lifted from the explainer page into thesis assets.
#
# SCOPE. A figure drawn for a web page simplifies deliberately and was composed
# for a screen, so a lifted figure ships only with a thesis caption that
# restores what the page leaves out.  Two kinds are lifted: figures that carry
# *measured data* (line counts, theory counts, the session layering), where
# re-deriving the numbers by hand would drift, and static figures whose content
# the thesis states in the same form (a compiled graph, a schematic contrast).
# Where a lifted figure shows analyzer output, the regression fixture named in
# `why` pins the output; this manifest only pins the drawing to the page.
#
# `thesis/tools/explainer_svg.py` reads this file, pulls each figure out of
# pages/index.html, inlines the stylesheet rules that apply, and rewrites the
# site palette into the thesis one.  pages/ is never written to.
#
#   scene         class of the enclosing <figure>, for a graph the page draws
#                 twice with the same label.  Narrows the other two handles.
#   aria_prefix   a prefix of the figure's aria-label -- the stable handle,
#                 since no <svg> on the page carries an id.  Must match exactly
#                 one figure; two matches is an error, not a first-wins.
#   svg_class     alternative handle, for a figure whose aria-label it shares
#                 with another.  Must also be unique.
#   css           figure stylesheet modules under pages/figures/ whose rules
#                 style this figure.  pages/style.css is always included.
#   viewbox       replacement viewBox, where the page lets a label overflow.
#   colours       per-figure palette entries, {page colour = thesis colour},
#                 for a colour that means something else in this figure.
#   drop_classes  elements to remove, for a figure whose page shows them only
#                 in another state.  Choosing the frame is editorial; record it.
#   chapter       where the figure is intended to land (docs/THESIS_BLUEPRINT.md §7)
#   why           what the figure is for -- quoted back by a failing check

# ----------------------------------------------------------------- Part I --

[figures.runs]
aria_prefix = "Left: four tested runs pass"
css = ["runs"]
# The panel notes repeat the caption at an unreadable print size.
drop_classes = ["probe", "sweep", "panel-note"]
chapter = "1.1"
why = "Testing observes chosen runs; an analysis result is one region containing every run, tried or not."

[figures.source-morph]
aria_prefix = "The compiled graph of the counting loop"
css = ["source-morph"]
# Amber would read as "trusted"; entry and result nodes are only distinguished.
colours = { "#d99a2b" = "neutral" }
# "Statement n" repeats the ppN label; the caption gives the correspondence.
drop_classes = ["sm-num"]
chapter = "3.4"
why = "The counting loop as the compiler numbers it; tests/regression/24-site-figures/precision/03-counting_loop.vimp pins the graph."

# ---------------------------------------------------------------- Part II --

[figures.strata]
aria_prefix = "A cross-section of rock layers"
css = ["strata"]
chapter = "Appendix A (session structure)"
why = "The formalization in cross-section: one stratum per session, sized by its proof."

# Not extractable, deliberately absent
# -----------------------------------
# These figures are empty <svg> shells in the page; pages/figures/*.js builds
# their contents at run time, so a static copy yields nothing.  The extractor
# detects and rejects them rather than writing a blank file.
#
#   gamma             "What an abstract value stands for"   (gamma.js)
#   timeline-of-runs  the literature time axis               (timeline.js)
#   recursion         the call spiral                        (recursion-spiral.js)
#
# One more is excluded for a different reason.  `contexts` ("how many copies of
# a procedure") is not a shell -- its markup holds 46 elements -- but the page
# builds the per-context boxes as HTML overlaid on the SVG and switches frames
# with a CSS-only radio tab, so a static copy renders the root node and nothing
# else.  A figure whose content is not in the SVG cannot be lifted out of it.
# `program-and-values` ("many runs in, one region out") fails the same way:
# particles.js draws the nodes, so the extract has the edges and the guard
# labels and no program points at all.
#
# For the thesis: capture these with scripts/capture_readme_figures.mjs, which
# already drives Chrome with the scripts running, or redraw it in fletcher from
# the call-string example in Example_Sign_DG_CallString_K1/K2.
#
# For the thesis: gamma and the strategy tree are better drawn natively anyway
# (fletcher/curryst, payload from Abstract_Domain.thy and Basics_side.thy); the
# literature timeline is bibliography data and belongs in Chapter 13 as a table
# or a generated plot, not as a lifted web figure.
