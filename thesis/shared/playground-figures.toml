# The README's playground figures, carried into Chapter 11.
#
# Each entry is one run of the browser playground: a screenshot regenerated by
# scripts/capture_readme_figures.mjs, the program it shows, and the settings it
# was run at. thesis/tools/playground_figures.py copies the image and program
# under shared/generated/playground/ and derives the link that reopens the run,
# so the figure, its program and its link cannot drift apart.
#
#   image     the captured screenshot under docs/images
#   program   the program under docs/readme-figures (absent for a bundled example)
#   analysis, globals, context, k   the run's settings, as the CLI flags name them
#   why       what the figure is placed to show -- quoted by a failing check

[figures.while-loop]
image = "docs/images/while_loop_cfg.png"
program = "docs/readme-figures/while-loop.vimp"
analysis = "interval"
globals = "warrow"
context = "none"
why = "The running example: a PROVED check in the source, its state, and the solved graph."

[figures.overview]
image = "docs/images/playground-overview.png"
analysis = "interval"
globals = "warrow"
context = "call-string"
k = 1
why = "Every verdict kind, an arithmetic warning, and one graph box per procedure and context, in one run."

[figures.division-definite]
image = "docs/images/playground-division-definite.png"
program = "docs/readme-figures/division-definite.vimp"
analysis = "interval"
globals = "warrow"
context = "none"
why = "A divisor that is zero in every live context: two errors while both checks still prove."

[figures.division-possible]
image = "docs/images/playground-division-possible.png"
program = "docs/readme-figures/division-possible.vimp"
analysis = "interval"
globals = "warrow"
context = "none"
why = "A divisor the state cannot exclude from being zero: a warning and an UNKNOWN check."

[figures.contexts]
image = "docs/images/playground-contexts.png"
program = "docs/readme-figures/contexts.vimp"
analysis = "interval"
globals = "warrow"
context = "entry-state"
why = "The same two calls without and with entry-state contexts: UNKNOWN twice, then PROVED twice with one box per argument."

[figures.int-refinement]
image = "docs/images/playground-int-refinement.png"
program = "docs/readme-figures/int-refinement.vimp"
analysis = "int"
globals = "warrow"
context = "none"
why = "The product domain proving y == 2 where sign, interval and parity each answer UNKNOWN."
