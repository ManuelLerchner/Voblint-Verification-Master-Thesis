<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Entity Order</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9dc;
    --thm: #2e7d32; --const: #1f5fbf; --type: #7b3fa0; --locale: #00838f;
    --late: #d32f2f; --near: #ef8f00; --edge: #9a9aa2; --hi: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --panel: #1f1f23; --fg: #ececf0; --muted: #a0a0a8; --line: #34343a;
      --thm: #66bb6a; --const: #64a0f0; --type: #b98ad6; --locale: #4dd0e1;
      --late: #ff6b6b; --near: #ffb74d; --edge: #6d6d76; --hi: #fff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
  #cy { position: relative; min-width: 0; }
  header { position: absolute; z-index: 2; top: 10px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  header > * { pointer-events: auto; }
  input[type=search] { width: 220px; padding: 5px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--fg); }
  label.t { display: inline-flex; gap: 4px; align-items: center; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .stat { padding: 4px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 2px; word-break: break-all; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .muted { color: var(--muted); }
  .k { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  li a.n { cursor: pointer; color: var(--fg); text-decoration: none; font-family: ui-monospace, monospace; }
  li a.n:hover { text-decoration: underline; }
  .via { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; word-break: break-all; }
  .late { color: var(--late); font-weight: 600; }
  .near { color: var(--near); font-weight: 600; }
  .legend span { margin-right: 10px; white-space: nowrap; }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
  a { color: var(--const); }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 60vh 40vh; } }
</style>
</head>
<body>
<div id="app">
  <div id="cy">
    <header>
      <input id="q" type="search" placeholder="Find entity…">
      <label class="t"><input type="checkbox" id="showLate" checked> forward (red)</label>
      <label class="t"><input type="checkbox" id="showNear"> same section (orange)</label>
      <label class="t"><input type="checkbox" id="showMention"> forward from inline-only</label>
      <label class="t"><input type="checkbox" id="showOk"> satisfied (grey)</label>
      <label class="t"><input type="checkbox" id="mentions" checked> inline-only entities</label>
      <span class="stat" id="stats"></span>
    </header>
  </div>
  <aside id="side"></aside>
</div>
<script>
const DATA = /*DATA*/null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KIND = { thm: "theorem", const: "constant", type: "type", locale: "locale" };

// Columns are content files in reading order; rows are first introductions.
const files = DATA.files.filter(f => DATA.nodes.some(n => n.file === f));
const col = Object.fromEntries(files.map((f, i) => [f, i]));
const rows = {};
const nodes = [...DATA.nodes].sort((a, b) => a.order - b.order);
const COLW = 230, ROWH = 26;
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const out = {}, inc = {};
for (const e of DATA.edges) { (out[e.source] ||= []).push(e); (inc[e.target] ||= []).push(e); }
const bad = n => (out[n.id] || []).filter(e => e.late === "late" && !e.mention).length;
const status = e => !e.late ? "ok" : e.mention ? "mention" : e.late;

const elements = [];
for (const f of files) elements.push({ group: "nodes", data: { id: "col:" + f, label: f, header: 1 },
  position: { x: col[f] * COLW, y: -40 }, selectable: false, grabbable: false, classes: "header" });
for (const n of nodes) {
  const r = rows[n.file] = (rows[n.file] || 0) + 1;
  elements.push({ group: "nodes", data: { ...n, bad: bad(n) }, position: { x: col[n.file] * COLW, y: r * ROWH },
    classes: [n.kind, n.embed ? "embed" : "mention", n.pointerOnly ? "pointer" : "", bad(n) ? "bad" : ""].join(" ") });
}
DATA.edges.forEach((e, i) => elements.push({ group: "edges",
  data: { id: "e" + i, ...e, status: status(e) }, classes: status(e) }));

const cy = cytoscape({
  container: document.getElementById("cy"), elements, layout: { name: "preset" },
  wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 3,
  style: [
    { selector: "node", style: { shape: "round-rectangle", width: 200, height: 18,
      label: "data(label)", "font-size": 10, "font-family": "ui-monospace, monospace",
      "text-valign": "center", "text-halign": "center", color: "#fff",
      "text-max-width": 194, "text-overflow-wrap": "anywhere", "text-wrap": "ellipsis" } },
    { selector: "node.header", style: { "background-opacity": 0, color: css("--muted"),
      "font-size": 13, "font-weight": 700, "font-family": "ui-sans-serif, system-ui" } },
    ...Object.keys(KIND).map(k => ({ selector: "node." + k, style: { "background-color": css("--" + k) } })),
    { selector: "node.mention", style: { "background-opacity": 0.12, color: css("--fg"),
      "border-width": 1.5, "border-color": e => css("--" + e.data("kind")) } },
    { selector: "node.pointer", style: { "border-style": "dashed" } },
    { selector: "node.bad", style: { "border-width": 3, "border-color": css("--late") } },
    { selector: "edge", style: { width: 1, "curve-style": "unbundled-bezier",
      "control-point-distances": 40, "target-arrow-shape": "triangle", "arrow-scale": 0.7,
      "line-color": css("--edge"), "target-arrow-color": css("--edge"), opacity: 0.55 } },
    { selector: "edge.late", style: { "line-color": css("--late"), "target-arrow-color": css("--late"), width: 1.6, opacity: 0.9 } },
    { selector: "edge.near", style: { "line-color": css("--near"), "target-arrow-color": css("--near"), width: 1.3, opacity: 0.85 } },
    { selector: "edge.mention", style: { "line-color": css("--late"), "target-arrow-color": css("--late"),
      "line-style": "dashed", width: 1, opacity: 0.5 } },
    { selector: ".hidden", style: { display: "none" } },
    { selector: ".dim", style: { opacity: 0.12 } },
    { selector: "node:selected", style: { "border-width": 3, "border-color": css("--hi") } },
    { selector: "edge.focus", style: { opacity: 1, width: 2.2, "z-index": 10 } },
  ],
});

const ui = id => document.getElementById(id);
let focus = null;
function refresh() {
  const show = { late: ui("showLate").checked, near: ui("showNear").checked,
    mention: ui("showMention").checked, ok: ui("showOk").checked };
  cy.batch(() => {
    cy.nodes().not(".header").forEach(n => n.toggleClass("hidden", !ui("mentions").checked && !n.data("embed") && !n.data("bad")));
    cy.edges().forEach(e => {
      const onFocus = focus && (e.data("source") === focus || e.data("target") === focus);
      const visible = onFocus || show[e.data("status")];
      e.toggleClass("hidden", !visible || e.source().hasClass("hidden") || e.target().hasClass("hidden"));
      e.toggleClass("focus", !!onFocus);
    });
    cy.elements().removeClass("dim");
    if (focus) {
      const near = cy.getElementById(focus).closedNeighborhood();
      cy.elements().not(near).not(".header").addClass("dim");
    }
  });
  const late = DATA.edges.filter(e => status(e) === "late").length, nearN = DATA.edges.filter(e => status(e) === "near").length;
  ui("stats").innerHTML = `${nodes.length} cited · <span class="late">${late} forward</span> · <span class="near">${nearN} same section</span>`;
}
["showLate", "showNear", "showMention", "showOk", "mentions"].forEach(id => ui(id).addEventListener("change", refresh));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const where = n => `${n.file}:${n.line}`;
function entry(id, e, dir) {
  const n = byId[id];
  const st = status(e);
  const tag = st === "late" ? '<span class="late">forward</span> ' : st === "near" ? '<span class="near">same section</span> '
    : st === "mention" ? '<span class="muted">forward (inline)</span> ' : "";
  const via = e.via.length ? `<div class="via">via ${e.via.map(esc).join(" → ")}</div>` : "";
  return `<li>${tag}<span class="k" style="background:${css("--" + n.kind)}"></span><a class="n" data-id="${esc(id)}">${esc(n.label)}</a>
    <span class="muted">${where(n)}</span>${via}</li>`;
}
function show(id) {
  focus = id;
  const n = byId[id];
  const preds = (out[id] || []).slice().sort((a, b) => byId[a.target].order - byId[b.target].order);
  const deps = (inc[id] || []).slice().sort((a, b) => byId[a.source].order - byId[b.source].order);
  ui("side").innerHTML = `
    <h2>${esc(n.label)}</h2>
    <div class="muted"><span class="k" style="background:${css("--" + n.kind)}"></span>${KIND[n.kind]} · <code>${esc(n.full)}</code></div>
    ${n.url ? `<div><a href="${esc(n.url)}" target="_blank" rel="noopener">Isabelle definition ↗</a></div>` : ""}
    ${n.inGraph ? "" : '<div class="muted">No dependency data (library entity).</div>'}
    <h3>Introduced</h3><div>${where(n)}${n.pointerOnly ? ' <span class="muted">(only in overview files)</span>' : ""}</div>
    ${n.judged ? `<h3>First shown</h3><div>${n.judged}</div>` : ""}
    <h3>Citations (${n.cites.length})</h3><ul>${n.cites.map(c => `<li><code>${esc(c.file)}.typ:${c.line}</code> <span class="muted">${c.embed ? "embed" : "mention"}</span></li>`).join("")}</ul>
    <h3>Uses (${preds.length})</h3><ul>${preds.map(e => entry(e.target, e)).join("") || '<li class="muted">nothing cited</li>'}</ul>
    <h3>Used by (${deps.length})</h3><ul>${deps.map(e => entry(e.source, e)).join("") || '<li class="muted">nothing cited</li>'}</ul>`;
  ui("side").querySelectorAll("a.n").forEach(a => a.addEventListener("click", () => select(a.dataset.id)));
  refresh();
}
function select(id) {
  cy.$(":selected").unselect();
  const el = cy.getElementById(id);
  el.select();
  cy.animate({ center: { eles: el }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 250 });
  show(id);
}
function overview() {
  focus = null;
  const worst = nodes.filter(n => bad(n)).sort((a, b) => a.order - b.order);
  ui("side").innerHTML = `
    <h2>Thesis entity order</h2>
    <p class="muted">Columns are content files in reading order. Each entity sits at its first citation outside the overview
    files. An edge points from an entity to a cited entity its Isabelle statement uses (through at most a few uncited helpers).
    <span class="late">Red</span>: the predecessor is introduced in a later section or never.
    <span class="near">Orange</span>: later in the same section. Entities shown with <code>thy</code>, <code>proved</code> or a
    theorem environment are judged at their first display; dashed red edges are forward uses from entities only cited inline,
    which the thesis permits.</p>
    <div class="legend">${Object.entries(KIND).map(([k, v]) => `<span><span class="k" style="background:${css("--" + k)}"></span>${v}</span>`).join("")}</div>
    <p class="muted">Filled: shown with <code>thy</code>, <code>proved</code> or a theorem environment. Outlined: only cited inline.
    Dashed: only cited in overview files.</p>
    <h3>Entities with forward predecessors (${worst.length})</h3>
    <ul>${worst.map(n => `<li><span class="k" style="background:${css("--" + n.kind)}"></span><a class="n" data-id="${esc(n.id)}">${esc(n.label)}</a>
      <span class="muted">shown ${n.judged}</span> <span class="late">${bad(n)}</span></li>`).join("")}</ul>`;
  ui("side").querySelectorAll("a.n").forEach(a => a.addEventListener("click", () => select(a.dataset.id)));
  refresh();
}
cy.on("tap", "node", ev => { if (!ev.target.hasClass("header")) show(ev.target.id()); });
cy.on("tap", ev => { if (ev.target === cy) { cy.$(":selected").unselect(); overview(); } });
ui("q").addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = ev.target.value.toLowerCase();
  const hit = nodes.find(n => n.label.toLowerCase() === q) || nodes.find(n => n.label.toLowerCase().includes(q));
  if (hit) select(hit.id);
});
overview();
cy.fit(cy.nodes(), 30);
</script>
</body>
</html>
