# Composite action to setup Isabelle
# NOTE: Needs to be run under the makarius/isabelle:Isabelle2025-2 container
name: Setup Isabelle
description: 'Setup Isabelle: checkout the AFP, set environment variables, cache heap images'
inputs:
  use-cache:
    description: >-
      Restore/save the cross-run heap cache. Set to 'false' for split jobs
      that instead receive an exact heap state via a same-run workflow
      artifact (see build-isabelle in ci.yml) -- only one job per workflow
      run should write the cross-run cache, to avoid multiple writers
      racing to save the same key.
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Checkout AFP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: isabelle-prover/mirror-afp-2025-1
        path: afp
        persist-credentials: false

    - name: Set AFP component base
      shell: bash
      run: |
        echo "AFP_COMPONENT_BASE=afp/thys" >> $GITHUB_ENV

    - name: Set Isabelle home
      shell: bash
      run: |
        {
          echo "ISABELLE_HOME<<ISABELLE_HOME_EOF"
          /home/isabelle/Isabelle/bin/isabelle getenv -b ISABELLE_HOME
          echo "ISABELLE_HOME_EOF"
        } >> "$GITHUB_ENV"

    - name: Set Isabelle home user
      shell: bash
      run: |
        {
          echo "ISABELLE_HOME_USER<<ISABELLE_HOME_USER_EOF"
          "$ISABELLE_HOME/bin/isabelle" getenv -b ISABELLE_HOME_USER
          echo "ISABELLE_HOME_USER_EOF"
        } >> "$GITHUB_ENV"

    - name: Set Isabelle binary
      shell: bash
      run: |
        {
          echo "ISABELLE<<ISABELLE_BIN_EOF"
          echo "$ISABELLE_HOME/bin/isabelle"
          echo "ISABELLE_BIN_EOF"
        } >> "$GITHUB_ENV"

    # A slug of `isabelle version` (e.g. "Isabelle2025-2:cbc7bdb4bb4b"), not a
    # hardcoded literal, so bumping the container image tag in ci.yml
    # automatically invalidates old heap caches instead of silently
    # restoring heaps built by a different Isabelle build.
    - name: Resolve Isabelle version identifier for the cache key
      shell: bash
      run: |
        # Capture into a variable first: command substitution strips all
        # trailing newlines, so the later `tr -c` (which treats a newline
        # as "not in the allowed set" and would otherwise turn it into a
        # literal `-`) can't eat the line terminator the GITHUB_ENV
        # heredoc format requires before its closing delimiter.
        slug=$("$ISABELLE" version | tr -c 'A-Za-z0-9._-' '-')
        {
          echo "ISABELLE_VERSION_SLUG<<ISABELLE_VERSION_SLUG_EOF"
          echo "$slug"
          echo "ISABELLE_VERSION_SLUG_EOF"
        } >> "$GITHUB_ENV"

    # Cache key spans the hard binary/build compatibility boundaries (OS,
    # arch, Isabelle version, AFP mirror branch), not every source file --
    # the point is to let a *different* commit's heap state restore so
    # `isabelle build`'s own staleness check has something to work
    # incrementally from. A cache hit here is never treated as evidence the
    # source tree is valid: every downstream `pixi run <task>` still runs
    # its own `isabelle build`/`isabelle lint` command, which recomputes
    # session digests from content and rebuilds whatever changed --
    # restoring a stale or even irrelevant heap only changes how much of
    # that rebuild is needed, never whether it happens.
    - name: Restore/save Isabelle heap cache
      if: inputs.use-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ISABELLE_HOME_USER }}/heaps/
        key: isabelle-heaps-${{ runner.os }}-${{ runner.arch }}-${{ env.ISABELLE_VERSION_SLUG }}-afp-mirror-2025-1-${{ github.sha }}
        restore-keys: |
          isabelle-heaps-${{ runner.os }}-${{ runner.arch }}-${{ env.ISABELLE_VERSION_SLUG }}-afp-mirror-2025-1-
