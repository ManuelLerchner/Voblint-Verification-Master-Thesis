# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # build-isabelle is the sole cross-run heap-cache writer (see #103): a
  # plain incremental build (no -c) that both validates and warms the
  # cache, then hands its exact heap state to the jobs below as a
  # same-run workflow artifact (use-cache: false on all of them, so only
  # one job ever writes the cross-run cache). Every consumer still runs
  # its real `isabelle build`/`isabelle lint` command -- the artifact
  # only changes how much of that is incremental, never whether it runs,
  # so a stale or restored-from-a-different-commit heap can never make a
  # broken source tree look green.
  build-isabelle:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        id: setup-isabelle
        uses: $/.github/actions/setup-isabelle-action

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Detect Isabelle theory changes
        id: changed
        shell: bash
        run: |
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files=$(git diff --name-only "origin/$GITHUB_BASE_REF...$GITHUB_SHA")
            while IFS= read -r path; do
              case "$path" in *.thy) changed=true; break ;; esac
            done <<< "$files"
          else
            # The before SHA is absent on some main-branch runs (notably an
            # initial push), so inspect the commit itself in that case.
            if [[ -n "$GITHUB_EVENT_BEFORE" ]] \
              && git cat-file -e "$GITHUB_EVENT_BEFORE^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")
            else
              files=$(git diff-tree --root --no-commit-id --name-only -r -m "$GITHUB_SHA")
            fi
            while IFS= read -r path; do
              case "$path" in *.thy) changed=true; break ;; esac
            done <<< "$files"
          fi
          echo "thy=$changed" >> "$GITHUB_OUTPUT"
          echo "Isabelle theory changes: $changed"

      # Plain incremental build (no -c): the actual cache writer and the
      # thing that validates/warms the heap cache. html.sh's -c flag
      # forces a clean rebuild of every session regardless of cache state
      # (needed so -o browser_info presents every session, not just
      # changed ones) -- using it here would defeat the cache on every
      # single run. html generation is its own downstream consumer job
      # below, which pays that -c cost only when actually needed.
      - name: Build (incremental, populates the heap cache)
        if: steps.changed.outputs.thy == 'true'
        run: pixi run isabelle-build

      - name: Skip build when theories are unchanged
        if: steps.changed.outputs.thy != 'true'
        run: echo "No .thy files changed; skipping the Isabelle build."

      - name: Report heap store size
        run: du -sh "$ISABELLE_HOME_USER/heaps/"

      - name: Upload heap state for same-run consumers
        if: ${{ always() && steps.setup-isabelle.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/
          retention-days: 1

  # Isabelle cancels the remaining theories in a session after an error. If
  # the integration build fails, retry each example leaf in its own build
  # invocation so one red session cannot hide failures in its siblings. A
  # single recovery runner shares partial heaps across the retries and runs
  # only on failure, avoiding the repeated dependency builds of a permanent
  # matrix.
  diagnose-isabelle-failure:
    needs: build-isabelle
    if: ${{ always() && needs.build-isabelle.result == 'failure' }}
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Reuse partial heap state from the failed integration build
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Diagnose example sessions independently
        shell: bash
        run: |
          sessions=(
            Voblint_Examples_CFG
            Voblint_Examples_Congruence
            Voblint_Examples_Sign
            Voblint_Examples_Interval
            Voblint_Examples_Parity
            Voblint_Examples_Int
            Voblint_Examples_Relational
            Voblint_Examples_Tooling
            Voblint_Examples_CLI
            Voblint_Examples
          )
          failed=()
          for session in "${sessions[@]}"; do
            if SESSION="$session" pixi run isabelle-build; then
              printf 'PASS %s\n' "$session"
            else
              printf 'FAIL %s\n' "$session"
              failed+=("$session")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            printf 'Failed example sessions:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  html:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      # Still a clean build (-c) internally, for browser_info's own
      # every-session-presented requirement -- consuming build-isabelle's
      # heaps here doesn't avoid that, it just keeps that cost isolated
      # to this job instead of gating the fast validation jobs on it.
      - name: Build HTML docs (clean build of every session)
        run: pixi run isabelle-docs-build

      # This job has the only freshly rendered tree in CI, so it is where the
      # link map is regenerated. It reports drift rather than gating: the
      # authoritative check is thesis-links-live, which runs after the pages
      # are actually published.
      - name: Regenerate thesis link map from the fresh HTML
        run: pixi run thesis-links-write

      - name: Report link-map drift (advisory)
        run: |
          if ! git diff --quiet -- thesis/shared/generated/links.json; then
            echo "::warning::thesis/shared/generated/links.json is out of date."
            echo "Run: pixi run isabelle-docs-build && pixi run thesis-links-write, then commit."
            git --no-pager diff -- thesis/shared/generated/links.json | head -60
          else
            echo "link map matches the freshly rendered theories"
          fi

      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-docs
          path: build/isabelle-html
          retention-days: 1

  isabelle-lint:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      # Theorem statements the thesis reproduces are re-exported from the built
      # session and diffed. This is the Typst template's replacement for
      # Isabelle's @{thm} antiquotation, so it needs the heaps this job has.
      - name: Thesis theorem statements match what Isabelle proves
        run: pixi run thesis-facts

      - name: Isabelle community linter
        run: pixi run isabelle-lint

  codegen-check:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Codegen drift check
        run: pixi run codegen-check

  regression-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Verification task surface
        run: pixi run verification-surface-check

      - name: Isabelle ASCII-only sources
        run: pixi run isabelle-ascii-check

      - name: Session ROOT structure and theory reachability
        run: pixi run sessions-check

      - name: Generated analysis assembly drift
        run: pixi run assembly-check

      - name: Analysis registry support policy
        run: pixi run analysis-registry-check

      - name: Generated OCaml public API
        run: pixi run codegen-api-check

      - name: Regression fixture conventions (no build needed -- fail fast)
        run: pixi run regression-lint

      - name: VIMP identifier id_position/markup shape (no build needed -- fail fast)
        run: pixi run grammar-id-position-check

        # manifests/vimp-grammar.yaml is the sole source of truth for VIMP syntax, and both
      # generated frontends must agree with it. The lefthook pre-commit hook
      # enforces this locally; without a CI job a hand-edited .mly, or a
      # vimp.yaml change committed with LEFTHOOK=0, reaches main green.
      - name: VIMP grammar drift, both frontends (no build needed -- fail fast)
        run: pixi run grammar-check

      # The export must emit exactly Generated, Bit_Shifts and Str_Literal; a
      # per-theory split means `module_name Generated` was lost, and surfaces
      # later as a module dependency cycle that names two constants and no
      # theory. Reads the checked-in export, so it
      # needs no Isabelle.
      - name: Code-export module map (no build needed -- fail fast)
        run: pixi run codegen-modules-check

      # Every \isathm / \isaconst / \isatype / \isalocale in the thesis is
      # resolved against the command that declares it, so a rename in the
      # theories fails here instead of leaving the thesis describing something
      # that no longer exists. Reads .thy sources directly -- no Isabelle.
      - name: Thesis references resolve against the theories (no build needed)
        run: pixi run thesis-refs

      # Declarations the thesis shows are lifted out of the theories by name.
      # Text extraction only, so this catches an edited definition without
      # waiting for Isabelle.
      - name: Thesis snippets match the theories (no build needed)
        run: pixi run thesis-snippets

      # check_thy_prose_refs resolves a cited name against every .thy under src/
      # AND vendor/, so prose naming a vendored TD constant
      # (update_global_warrowing_apinis, sides_of_rhs_local, ...) reads as
      # dangling unless the submodule is present. The checkout above is
      # submodules: false, so it has to be initialised here -- after the four
      # checks that genuinely need nothing, so those still fail fast.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      # Isabelle does not resolve a plain \<open>name\<close> cartouche, so a rename
      # leaves prose describing a constant that no longer exists.
      - name: Theory prose references (no build needed -- fail fast)
        run: pixi run theory-prose-check

      - name: Retired Isabelle identifiers
        run: pixi run retired-identifiers-check

      - name: Locale assumption parameters
        run: pixi run locale-parameters-check

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: '5'

      - name: Install OCaml build dependencies
        run: pixi run ocaml-deps-install

      # This job checks out without submodules, but the CLI refuses --html
      # without the frontend, and the smoke tests exercise --html for real --
      # so the submodule has to land before the first CLI run, not before the
      # report gates that come later.
      - name: Fetch the g2html frontend --html renders through
        run: git submodule update --init vendor/g2html

      - name: Compile and run codegen/regression drivers against codegen/generated/
        # ocaml/setup-ocaml@v3 puts `opam` on PATH but later run steps do not
        # inherit the selected switch environment. Each OCaml build adapter
        # enters that switch with `opam exec` before invoking Dune.
        run: pixi run codegen-regression

      - name: External .vimp regression corpus (source -> parser -> analyse -> checks)
        run: pixi run cli-test

      - name: Arithmetic diagnostics and annotated warning expectations
        run: pixi run arithmetic-diagnostics-check

      - name: CLI plumbing smoke tests (exit codes, --help, argument errors)
        run: pixi run cli-smoke

      # Figures built from analyzer output are regenerated and diffed against
      # what is committed. A behaviour change that a thesis figure describes
      # fails here, naming the claim, instead of silently making the figure a
      # record of how the analyzer used to behave.
      - name: Thesis claims still match the CLI
        run: pixi run thesis-claims

      - name: Parser/printer property tests (round-trip + mutation fuzzing)
        run: pixi run property-test

      # The report is a contract with a frontend this repository does not own,
      # and its faults are quiet ones: a renamed element, a repeated span, an
      # empty findings list all render a page that looks fine. `pixi run verify`
      # and these CI leaves intentionally use the same named tasks.
      - name: HTML report structure (element shapes g2html's stylesheets read)
        run: pixi run html-report-structure-check

      - name: HTML report sweep over the regression corpus
        run: pixi run html-report-corpus-audit

      - name: HTML report sweep over the domain/solver/context space
        run: pixi run html-report-config-audit

  formalization-pdf:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git and LaTeX toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq git pandoc latexmk texlive-luatex texlive-latex-extra \
            texlive-fonts-recommended texlive-science > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Check PDF theory selection
        run: pixi run isabelle-pdf-selection-check

      - name: Build formalization PDF with certificate appendix
        run: pixi run isabelle-pdf-build

      - name: Upload formalization PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formalization-pdf
          path: output/document.pdf
          retention-days: 7
          if-no-files-found: error

  thesis-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      # Typst comes from the `thesis` pixi feature, so CI and a working copy
      # build with the same version.
      # Warnings are failures here: an unresolved reference or an overflowing
      # box must not reach a PDF a supervisor reads. Graphviz sources are laid
      # out inside the document, so there is no figure-rendering step.
      - name: Build the thesis (warnings are errors)
        run: pixi run thesis-typst

      # Downloadable from the run, so a reviewer never has to install a
      # toolchain to see what a branch changed.
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thesis-pdf
          path: thesis/Voblint_Thesis.pdf
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: html
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: html-docs
          path: build/isabelle-html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/isabelle-html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A link in the thesis points at a page on GitHub Pages, so it can only be
  # validated once that page exists. This is the one check that sees what a
  # reader sees: it fetches every URL in the link map and verifies the page
  # responds *and* still carries the anchor the citation targets.
  thesis-links-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      # Pages serves a new deployment with a short delay; the checker retries
      # with backoff rather than failing on the first miss.
      - name: Thesis links reach their definition on the published site
        run: pixi run thesis-links-live
