# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-isabelle-ascii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Isabelle ASCII-only sources
        run: |
          find src -name '*.thy' -print0 | xargs -0 python3 scripts/check_isabelle_ascii.py

  # build-isabelle is the sole cross-run heap-cache writer (see #103): a
  # plain incremental build (no -c) that both validates and warms the
  # cache, then hands its exact heap state to the jobs below as a
  # same-run workflow artifact (use-cache: false on all of them, so only
  # one job ever writes the cross-run cache). Every consumer still runs
  # its real `isabelle build`/`isabelle lint` command -- the artifact
  # only changes how much of that is incremental, never whether it runs,
  # so a stale or restored-from-a-different-commit heap can never make a
  # broken source tree look green.
  build-isabelle:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      # Plain incremental build (no -c): the actual cache writer and the
      # thing that validates/warms the heap cache. html.sh's -c flag
      # forces a clean rebuild of every session regardless of cache state
      # (needed so -o browser_info presents every session, not just
      # changed ones) -- using it here would defeat the cache on every
      # single run. html generation is its own downstream consumer job
      # below, which pays that -c cost only when actually needed.
      - name: Build (incremental, populates the heap cache)
        run: pixi run build

      - name: Report heap store size
        run: du -sh "$ISABELLE_HOME_USER/heaps/"

      - name: Upload heap state for same-run consumers
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/
          retention-days: 1

  html:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@v4
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      # Still a clean build (-c) internally, for browser_info's own
      # every-session-presented requirement -- consuming build-isabelle's
      # heaps here doesn't avoid that, it just keeps that cost isolated
      # to this job instead of gating the fast validation jobs on it.
      - name: Build HTML docs (clean build of every session)
        run: pixi run html

      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/html
          retention-days: 1

  isabelle-lint:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@v4
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Isabelle community linter
        run: pixi run isabelle-lint

  codegen-check:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@v4
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Codegen drift check
        run: pixi run codegen-check

  codegen-ocaml-check:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git, unzip, build-essential, m4
        run: apt-get update -qq && apt-get install -y -qq git unzip build-essential m4 > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@v4
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Provision managed OCaml/zarith for Isabelle's own export check
        run: $ISABELLE ocaml_setup

      - name: Isabelle-native OCaml export_code check
        run: pixi run codegen-ocaml-check

  regression-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'

      - name: Install zarith + menhir (Code_Target_Numeral, and the voblint
          CLI/property-test parser generator)
        run: opam install -y zarith menhir

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Compile and run codegen/regression drivers against codegen/generated/
        # ocaml/setup-ocaml@v3 puts `opam` itself on PATH but does not export the
        # switch's own bin dir (ocamlfind, ocamlopt) into later run steps' shells --
        # a plain `pixi run regression` sub-shell then can't find ocamlfind even
        # though opam install (also just `opam`, not a switch binary) succeeded
        # one step earlier. `opam exec --` activates the switch environment for
        # this invocation.
        run: opam exec -- pixi run regression

      - name: External .vimp regression corpus (source -> parser -> analyse -> checks)
        run: opam exec -- pixi run cli-test

      - name: Parser/printer property tests (round-trip + mutation fuzzing)
        run: opam exec -- pixi run property

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: html
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
