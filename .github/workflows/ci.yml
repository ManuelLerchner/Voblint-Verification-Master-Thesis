# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-isabelle-ascii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Isabelle ASCII-only sources
        run: |
          find src -name '*.thy' -print0 | xargs -0 python3 scripts/check_isabelle_ascii.py

  # build-isabelle is the sole cross-run heap-cache writer (see #103): a
  # plain incremental build (no -c) that both validates and warms the
  # cache, then hands its exact heap state to the jobs below as a
  # same-run workflow artifact (use-cache: false on all of them, so only
  # one job ever writes the cross-run cache). Every consumer still runs
  # its real `isabelle build`/`isabelle lint` command -- the artifact
  # only changes how much of that is incremental, never whether it runs,
  # so a stale or restored-from-a-different-commit heap can never make a
  # broken source tree look green.
  build-isabelle:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      # Plain incremental build (no -c): the actual cache writer and the
      # thing that validates/warms the heap cache. html.sh's -c flag
      # forces a clean rebuild of every session regardless of cache state
      # (needed so -o browser_info presents every session, not just
      # changed ones) -- using it here would defeat the cache on every
      # single run. html generation is its own downstream consumer job
      # below, which pays that -c cost only when actually needed.
      - name: Build (incremental, populates the heap cache)
        run: pixi run build

      - name: Report heap store size
        run: du -sh "$ISABELLE_HOME_USER/heaps/"

      - name: Upload heap state for same-run consumers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/
          retention-days: 1

  html:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      # Still a clean build (-c) internally, for browser_info's own
      # every-session-presented requirement -- consuming build-isabelle's
      # heaps here doesn't avoid that, it just keeps that cost isolated
      # to this job instead of gating the fast validation jobs on it.
      - name: Build HTML docs (clean build of every session)
        run: pixi run html

      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-docs
          path: docs/html
          retention-days: 1

  isabelle-lint:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Isabelle community linter
        run: pixi run isabelle-lint

  codegen-check:
    needs: build-isabelle
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Download exact heap state from build-isabelle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Codegen drift check
        run: pixi run codegen-check

  regression-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Regression fixture conventions (no build needed -- fail fast)
        run: pixi run regression-lint

      - name: VIMP identifier id_position/markup shape (no build needed -- fail fast)
        run: pixi run id-position-check

      # grammar/vimp.yaml is the sole source of truth for VIMP syntax, and both
      # generated frontends must agree with it. The lefthook pre-commit hook
      # enforces this locally; without a CI job a hand-edited .mly, or a
      # vimp.yaml change committed with LEFTHOOK=0, reaches main green.
      - name: VIMP grammar drift, both frontends (no build needed -- fail fast)
        run: pixi run grammar-check

      # Every theory reachable from an export root needs a code_identifier
      # entry; a missing one surfaces later as a module dependency cycle that
      # names two constants and no theory. Reads the checked-in export, so it
      # needs no Isabelle.
      - name: Code-export module map (no build needed -- fail fast)
        run: pixi run codegen-modules

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
        with:
          ocaml-compiler: '5'

      - name: Install zarith + menhir (Code_Target_Numeral, and the voblint
          CLI/property-test parser generator)
        run: opam install -y zarith menhir

      # This job checks out without submodules, but the CLI refuses --html
      # without the frontend, and the smoke tests exercise --html for real --
      # so the submodule has to land before the first CLI run, not before the
      # report gates that come later.
      - name: Fetch the g2html frontend --html renders through
        run: git submodule update --init vendor/g2html

      - name: Compile and run codegen/regression drivers against codegen/generated/
        # ocaml/setup-ocaml@v3 puts `opam` itself on PATH but does not export the
        # switch's own bin dir (ocamlfind, ocamlopt) into later run steps' shells --
        # a plain `pixi run codegen-regression` sub-shell then can't find ocamlfind
        # even though opam install (also just `opam`, not a switch binary) succeeded
        # one step earlier. `opam exec --` activates the switch environment for
        # this invocation.
        run: opam exec -- pixi run codegen-regression

      - name: External .vimp regression corpus (source -> parser -> analyse -> checks)
        run: opam exec -- pixi run cli-test

      - name: CLI plumbing smoke tests (exit codes, --help, argument errors)
        run: opam exec -- pixi run cli-smoke

      - name: Parser/printer property tests (round-trip + mutation fuzzing)
        run: opam exec -- pixi run property

      # The report is a contract with a frontend this repository does not own,
      # and its faults are quiet ones: a renamed element, a repeated span, an
      # empty findings list all render a page that looks fine. `pixi run ci`
      # has covered these locally for a while; running them here is what stops
      # a change reaching main without them.
      - name: HTML report structure (element shapes g2html's stylesheets read)
        run: opam exec -- pixi run html-report-check

      - name: HTML report sweep over the regression corpus
        run: opam exec -- pixi run html-report-audit

      - name: HTML report sweep over the domain/solver/context space
        run: opam exec -- pixi run html-config-audit

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: html
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: html-docs
          path: docs/html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
