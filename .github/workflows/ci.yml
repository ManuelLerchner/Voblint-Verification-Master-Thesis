# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  # A manual run from any branch assembles the complete Pages site and uploads it
  # as an artifact; ticking `deploy` also publishes it, which the github-pages
  # environment only accepts from branches its deployment policy lists.
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the assembled site to GitHub Pages
        type: boolean
        default: false
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # isabelle-build is the sole cross-run heap-cache writer (see #103): a
  # plain incremental build (no -c) that both validates and warms the
  # cache, then hands its exact heap state to the jobs that wait on it
  # (thesis-facts, codegen-check) as a same-run workflow artifact, with
  # use-cache: false on each. html and isabelle-pdf do not wait --
  # neither is made faster by a freshly built heap -- and read the same
  # cross-run cache with use-cache: restore, so isabelle-build remains the
  # only writer either way. Every consumer still runs its real
  # `isabelle build`/`isabelle lint` command; the heap only changes how
  # much of that is incremental, never whether it runs, so a stale or
  # restored-from-a-different-commit heap can never make a broken source
  # tree look green.
  isabelle-build:
    runs-on: ubuntu-latest
    # Writes the heap cache, and is therefore also where the heaps it
    # superseded are removed.
    permissions:
      contents: read
      actions: write
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        id: setup-isabelle
        uses: $/.github/actions/setup-isabelle-action

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Detect Isabelle theory changes
        id: changed
        shell: bash
        run: |
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files=$(git diff --name-only "origin/$GITHUB_BASE_REF...$GITHUB_SHA")
            while IFS= read -r path; do
              case "$path" in *.thy) changed=true; break ;; esac
            done <<< "$files"
          else
            # The before SHA is absent on some main-branch runs (notably an
            # initial push), so inspect the commit itself in that case.
            if [[ -n "$GITHUB_EVENT_BEFORE" ]] \
              && git cat-file -e "$GITHUB_EVENT_BEFORE^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")
            else
              files=$(git diff-tree --root --no-commit-id --name-only -r -m "$GITHUB_SHA")
            fi
            while IFS= read -r path; do
              case "$path" in *.thy) changed=true; break ;; esac
            done <<< "$files"
          fi
          echo "thy=$changed" >> "$GITHUB_OUTPUT"
          echo "Isabelle theory changes: $changed"

      # Plain incremental build (no -c): the actual cache writer and the
      # thing that validates/warms the heap cache. html.sh's -c flag
      # forces a clean rebuild of every session regardless of cache state
      # (needed so -o browser_info presents every session, not just
      # changed ones) -- using it here would defeat the cache on every
      # single run. html generation is its own downstream consumer job
      # below, which pays that -c cost only when actually needed.
      - name: Build (incremental, populates the heap cache)
        if: steps.changed.outputs.thy == 'true'
        run: pixi run isabelle-build

      - name: Skip build when theories are unchanged
        if: steps.changed.outputs.thy != 'true'
        run: echo "No .thy files changed; skipping the Isabelle build."

      - name: Report heap store size
        run: du -sh "$ISABELLE_HOME_USER/heaps/"

      - name: Upload heap state for same-run consumers
        if: ${{ always() && steps.setup-isabelle.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/
          retention-days: 1

      # A restore falls back to the key prefix and lands on the newest entry, so
      # every older heap is unreachable weight -- 7 GB of a 10 GB budget,
      # evicting the HTML tree and the PDF to hold heaps nothing can select.
      # This run's own heap is saved in the job's post phase, after this step,
      # so what it leaves behind is the newest few plus that one. Only from
      # main: a branch does not clean up shared state.
      - name: Prune superseded heap caches
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run ci-prune-caches --apply

  # Isabelle cancels the remaining theories in a session after an error. If
  # the integration build fails, retry each example leaf in its own build
  # invocation so one red session cannot hide failures in its siblings. A
  # single recovery runner shares partial heaps across the retries and runs
  # only on failure, avoiding the repeated dependency builds of a permanent
  # matrix.
  isabelle-build-diagnose:
    needs: isabelle-build
    if: ${{ always() && needs.isabelle-build.result == 'failure' }}
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Reuse partial heap state from the failed integration build
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Diagnose example sessions independently
        shell: bash
        run: |
          sessions=(
            Voblint_Examples_CFG
            Voblint_Examples_Congruence
            Voblint_Examples_Sign
            Voblint_Examples_Interval
            Voblint_Examples_Parity
            Voblint_Examples_Int
            Voblint_Examples_Relational
            Voblint_Examples_Tooling
            Voblint_Examples_CLI
            Voblint_Examples
          )
          failed=()
          for session in "${sessions[@]}"; do
            if SESSION="$session" pixi run isabelle-build; then
              printf 'PASS %s\n' "$session"
            else
              printf 'FAIL %s\n' "$session"
              failed+=("$session")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            printf 'Failed example sessions:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  # Runs alongside isabelle-build rather than after it. html.sh's -c deletes
  # every Voblint_* heap before building, so the same-run artifact this job
  # used to wait for was discarded unread; only the ancestors outside that
  # selection (TD, HOL-Library, Root_Balanced_Tree) are reused, and the
  # cross-run cache supplies those. Restore-only, so isabelle-build stays
  # the sole writer.
  isabelle-html:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'restore'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      # The rendered tree is a function of the theory sources, the session
      # structure and the toolchain, and of nothing else, so a run whose
      # inputs are byte-identical to one already rendered restores that tree
      # instead of paying the clean build again. What counts as an input is
      # in scripts/ci_digest.py, for every cached artifact at once.
      - name: Digest the sources the HTML is rendered from
        id: sources
        shell: bash
        run: |
          digest=$(pixi run ci-digest html)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "HTML source digest: $digest"

      # Exact key, no restore-keys: a near miss would be a different tree
      # presented as this commit's, and a hit skips the build outright. The
      # heap cache can fall back because every consumer there still runs its
      # own `isabelle build`; here the cache *is* the answer.
      - name: Restore a previously rendered HTML tree
        id: html-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/isabelle-html
          key: isabelle-html-${{ runner.os }}-${{ runner.arch }}-${{ env.ISABELLE_VERSION_SLUG }}-afp-mirror-2025-2-${{ steps.sources.outputs.digest }}

      # A clean build (-c) internally, for browser_info's own
      # every-session-presented requirement. That cost is unavoidable and
      # stays isolated to this job.
      - name: Build HTML docs (clean build of every session)
        if: steps.html-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          pixi run isabelle-html-build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Reuse the cached HTML tree
        if: steps.html-cache.outputs.cache-hit == 'true'
        run: |
          echo "Sources unchanged since a rendered tree was cached; skipping the build."
          du -sh build/isabelle-html

      # Only a clean build of every session sees every elaboration, which is
      # why this lives here and not in isabelle-build (which skips when no
      # theory changed). A library session re-elaborated instead of inherited
      # costs real time and shows no other symptom -- it was 19% of a clean
      # build before the budgets in the script were met.
      - name: Library re-elaboration stays within budget
        if: steps.html-cache.outputs.cache-hit != 'true'
        run: pixi run reelaboration-check "$RUNNER_TEMP/build.log"

      # Saved only from main, and only when this run built the tree: a branch
      # writing its own entry per push would churn the repository's 10 GB
      # cache budget against the heap cache, which is the expensive one. A
      # pull request still restores main's entries.
      - name: Save the rendered HTML tree for later runs
        if: steps.html-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/isabelle-html
          key: ${{ steps.html-cache.outputs.cache-primary-key }}

      # This job has the only freshly rendered tree in CI, so it is where the
      # link map is regenerated. It reports drift rather than gating: the
      # authoritative check is thesis-links-live, which runs after the pages
      # are actually published.
      - name: Regenerate thesis link map from the fresh HTML
        run: pixi run thesis-links-write

      - name: Report link-map drift (advisory)
        run: |
          if ! git diff --quiet -- thesis/shared/generated/links.json; then
            echo "::warning::thesis/shared/generated/links.json is out of date."
            echo "Run: pixi run isabelle-html-build && pixi run thesis-links-write, then commit."
            git --no-pager diff -- thesis/shared/generated/links.json | head -60
          else
            echo "link map matches the freshly rendered theories"
          fi

      - name: Upload GitHub Pages site
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabelle-html
          path: build/isabelle-html
          retention-days: 1

  thesis-facts:
    needs: isabelle-build
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      # The check below is a function of the theories it re-exports from, the
      # session structure, and the two files it compares the export against, so a
      # tree identical to one that already passed has nothing to re-check. The
      # marker this restores carries no result: its presence under an exact key
      # IS the result, which is why the key must name everything the check reads.
      # It is computed before Setup Isabelle so a hit also skips the AFP checkout
      # and the heap download, which is most of this job's wall clock. pixi
      # comes first because the digest is a pixi task: seconds on a hit,
      # against the minutes that hit still skips.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Digest what the facts check compares
        id: sources
        shell: bash
        run: |
          digest=$(pixi run ci-digest thesis-facts)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Facts input digest: $digest"

      - name: Restore the marker of an earlier passing run
        id: facts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-marker/thesis-facts
          key: thesis-facts-${{ runner.os }}-${{ runner.arch }}-${{ steps.sources.outputs.digest }}

      - name: Setup Isabelle
        if: steps.facts-cache.outputs.cache-hit != 'true'
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        if: steps.facts-cache.outputs.cache-hit != 'true'
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Download exact heap state from isabelle-build
        if: steps.facts-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      # Theorem statements the thesis reproduces are re-exported from the built
      # session and diffed. This is the Typst template's replacement for
      # Isabelle's @{thm} antiquotation, so it needs the heaps this job has.
      - name: Thesis theorem statements match what Isabelle proves
        if: steps.facts-cache.outputs.cache-hit != 'true'
        run: pixi run thesis-facts

      - name: Report the reused result
        if: steps.facts-cache.outputs.cache-hit == 'true'
        run: echo "Inputs unchanged since these checks passed; skipping them."

      # Written only after the check passed, and only from main, so a marker can
      # never outrun the result it stands for.
      - name: Record the passing run
        if: steps.facts-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-marker"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/ci-marker/thesis-facts"

      - name: Save the marker for later runs
        if: steps.facts-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-marker/thesis-facts
          key: ${{ steps.facts-cache.outputs.cache-primary-key }}

      # These read the vendored solver: pages_stats.py measures it, and a name
      # the page cites may be declared there. They live in this job because it is the
      # one lint job that initialises the submodule; without it pages_stats.py
      # refuses to run rather than publish a wrong solver count.
      - name: Site repository figures are derived and current
        run: pixi run pages-stats

      # Same measurement, for the thesis: the committed stats.json must match
      # and no repository figure may be typed into the chapters by hand.
      - name: Thesis repository figures are derived and current
        run: pixi run thesis-stats

      - name: Every Isabelle name the site uses is linked into the theory HTML
        run: pixi run pages-terms

  codegen-check:
    needs: isabelle-build
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      # This check regenerates the export and diffs it against the tracked copy,
      # so the key names both sides. The generated side comes from
      # codegen-hash.sh, which is the repository's own definition of "codegen's
      # inputs" and is already shared by regenerate-codegen.sh and cli-build.sh;
      # spelling that list out again here would make this the third definition
      # of it, which is the thing that script exists to prevent. The tracked side
      # and the vendored solver (which codegen-hash.sh does not reach) are named
      # separately. Computed before Setup Isabelle, so a hit skips the AFP
      # checkout and the heap download as well as the check; pixi comes first
      # because the digest is a pixi task.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Digest what the codegen check compares
        id: sources
        shell: bash
        run: |
          digest=$(pixi run ci-digest codegen)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Codegen input digest: $digest"

      - name: Restore the marker of an earlier passing run
        id: codegen-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-marker/codegen-check
          key: codegen-check-${{ runner.os }}-${{ runner.arch }}-${{ steps.sources.outputs.digest }}

      - name: Setup Isabelle
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'false'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Download exact heap state from isabelle-build
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-heaps
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/

      - name: Codegen drift check
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: pixi run codegen-check

      - name: Report the reused result
        if: steps.codegen-cache.outputs.cache-hit == 'true'
        run: echo "Inputs unchanged since this check passed; skipping it."

      - name: Record the passing run
        if: steps.codegen-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-marker"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/ci-marker/codegen-check"

      - name: Save the marker for later runs
        if: steps.codegen-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-marker/codegen-check
          key: ${{ steps.codegen-cache.outputs.cache-primary-key }}

  regression-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Verification task surface
        run: pixi run verification-surface-check

      - name: Python formatting
        run: pixi run python-format-check

      - name: Python lint
        run: pixi run python-lint

      - name: Shell script lint
        run: pixi run shell-lint

      - name: GitHub workflow lint and audit
        run: pixi run actions-lint

      - name: Typst formatting
        run: pixi run typst-format-check

      - name: Markdown lint
        run: pixi run markdown-lint

      - name: Spelling
        run: pixi run spelling-check

      - name: TOML formatting
        run: pixi run toml-format-check

      - name: Site JavaScript and CSS formatting and lint
        run: pixi run pages-lint

      # Links are checked against the repository here, so a playground link naming
      # a missing example, fixture or setting fails before the site is built.
      - name: Site links and what playground links open (no build needed)
        run: pixi run pages-links


      - name: Fixture reader, example corpus and playground links
        run: pixi run pages-scripts-check

      - name: Isabelle ASCII-only sources
        run: pixi run isabelle-ascii-check

      - name: Session ROOT structure and theory reachability
        run: pixi run sessions-check

      - name: Site links' theory anchors match the theory sources
        run: pixi run theory-anchors-check

      - name: Generated analysis assembly drift
        run: pixi run assembly-check

      - name: Analysis registry support policy
        run: pixi run analysis-registry-check

      - name: Generated OCaml public API
        run: pixi run codegen-api-check

      - name: Regression fixture conventions (no build needed -- fail fast)
        run: pixi run regression-lint

      - name: VIMP identifier id_position/markup shape (no build needed -- fail fast)
        run: pixi run grammar-id-position-check

        # manifests/vimp-grammar.yaml is the sole source of truth for VIMP syntax, and both
      # generated frontends must agree with it. The lefthook pre-commit hook
      # enforces this locally; without a CI job a hand-edited .mly, or a
      # vimp.yaml change committed with LEFTHOOK=0, reaches main green.
      - name: VIMP grammar drift, both frontends (no build needed -- fail fast)
        run: pixi run grammar-check

      # The export must emit exactly Generated, Bit_Shifts and Str_Literal; a
      # per-theory split means `module_name Generated` was lost, and surfaces
      # later as a module dependency cycle that names two constants and no
      # theory. Reads the checked-in export, so it
      # needs no Isabelle.
      - name: Code-export module map (no build needed -- fail fast)
        run: pixi run codegen-modules-check


      # The Goblint comparison appendix is generated from the explainer's
      # alignment rows; the committed JSON must match the page.
      - name: Thesis Goblint comparison matches the explainer (no build needed)
        run: pixi run thesis-alignment

      # The notation table is derived from the theories and rendered in the
      # thesis, the README and the explainer; all three must be current.
      - name: Thesis notation table matches the theories (no build needed)
        run: pixi run thesis-notation

      # check_thy_prose_refs resolves a cited name against every .thy under src/
      # AND vendor/, so prose naming a vendored TD constant
      # (update_global_warrowing_apinis, sides_of_rhs_local, ...) reads as
      # dangling unless the submodule is present. The checkout above is
      # submodules: false, so it has to be initialised here -- after the four
      # checks that genuinely need nothing, so those still fail fast.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      # Every \isathm / \isaconst / \isatype / \isalocale in the thesis is
      # resolved against the command that declares it, so a rename in the
      # theories fails here instead of leaving the thesis describing something
      # that no longer exists. Reads .thy sources directly -- no Isabelle; HOL
      # names resolve through the committed link map. Needs td-verification.
      - name: Thesis references resolve against the theories (no build needed)
        run: pixi run thesis-refs

      # Declarations the thesis shows are lifted out of the theories by name.
      # Text extraction only, so this catches an edited definition without
      # waiting for Isabelle. HOL snippets are left to the jobs that have it.
      - name: Thesis snippets match the theories (no build needed)
        run: pixi run thesis-snippets

      # Isabelle does not resolve a plain \<open>name\<close> cartouche, so a rename
      # leaves prose describing a constant that no longer exists.
      - name: Theory prose references (no build needed -- fail fast)
        run: pixi run theory-prose-check

      - name: Retired Isabelle identifiers
        run: pixi run retired-identifiers-check

      - name: Locale assumption parameters
        run: pixi run locale-parameters-check

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: '5'

      - name: Install OCaml build dependencies
        run: pixi run ocaml-deps-install

      - name: OCaml formatting
        run: pixi run ocaml-format-check

      - name: opam manifest lint
        run: pixi run opam-lint

      # This job checks out without submodules, but the CLI refuses --html
      # without the frontend, and the smoke tests exercise --html for real --
      # so the submodule has to land before the first CLI run, not before the
      # report gates that come later.
      - name: Fetch the g2html frontend --html renders through
        run: git submodule update --init vendor/g2html

      - name: Compile and run codegen/regression drivers against codegen/generated/
        # ocaml/setup-ocaml@v3 puts `opam` on PATH but later run steps do not
        # inherit the selected switch environment. Each OCaml build adapter
        # enters that switch with `opam exec` before invoking Dune.
        run: pixi run codegen-regression

      - name: External .vimp regression corpus (source -> parser -> analyse -> checks)
        run: pixi run cli-test

      - name: Arithmetic diagnostics and annotated warning expectations
        run: pixi run arithmetic-diagnostics-check

      - name: CLI plumbing smoke tests (exit codes, --help, argument errors)
        run: pixi run cli-smoke

      # Figures built from analyzer output are regenerated and diffed against
      # what is committed. A behaviour change that a thesis figure describes
      # fails here, naming the claim, instead of silently making the figure a
      # record of how the analyzer used to behave.
      - name: Thesis claims still match the CLI
        run: pixi run thesis-claims

      # Every VIMP listing opens its own program in the playground, at the
      # settings of the claim or fixture it shows, as a clickable PDF link.
      - name: Thesis VIMP listings link their programs
        run: pixi run thesis-vimp

      - name: Parser/printer property tests (round-trip + mutation fuzzing)
        run: pixi run property-test

      # The report is a contract with a frontend this repository does not own,
      # and its faults are quiet ones: a renamed element, a repeated span, an
      # empty findings list all render a page that looks fine. `pixi run verify`
      # and these CI leaves intentionally use the same named tasks.
      - name: HTML report structure (element shapes g2html's stylesheets read)
        run: pixi run html-report-structure-check

      - name: HTML report sweep over the regression corpus
        run: pixi run html-report-corpus-audit

      - name: HTML report sweep over the domain/solver/context space
        run: pixi run html-report-config-audit

  # Unpinned from isabelle-build for the same reason as html, by a different
  # mechanism: Voblint_Document re-elaborates all 223 theories from HOL (the
  # session's own 32 min; its document step is 23s of that), so the inherited
  # heaps never shortened it. Measured across runs, this job takes 22-34 min
  # whether isabelle-build rebuilt for 41 min or skipped entirely.
  isabelle-pdf:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - name: Install git and LaTeX toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq git pandoc latexmk texlive-luatex texlive-latex-extra \
            texlive-fonts-recommended texlive-science > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: $/.github/actions/setup-isabelle-action
        with:
          use-cache: 'restore'

      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Check PDF theory selection
        run: pixi run isabelle-pdf-selection-check

      # Same scheme as the HTML job, over what this document is made from:
      # the theories, the session structure, the LaTeX root and the README the
      # title pages carry, and the scripts that assemble them.
      - name: Digest the sources the PDF is rendered from
        id: sources
        shell: bash
        run: |
          digest=$(pixi run ci-digest pdf)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "PDF source digest: $digest"

      - name: Restore a previously rendered PDF
        id: pdf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/document.pdf
          key: isabelle-pdf-${{ runner.os }}-${{ runner.arch }}-${{ env.ISABELLE_VERSION_SLUG }}-afp-mirror-2025-2-${{ steps.sources.outputs.digest }}

      - name: Build formalization PDF with certificate appendix
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: pixi run isabelle-pdf-build

      - name: Reuse the cached PDF
        if: steps.pdf-cache.outputs.cache-hit == 'true'
        run: |
          echo "Sources unchanged since a PDF was cached; skipping the render."
          ls -lh output/document.pdf

      - name: Save the rendered PDF for later runs
        if: steps.pdf-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/document.pdf
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}

      - name: Upload formalization PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isabelle-pdf
          path: output/document.pdf
          retention-days: 7
          if-no-files-found: error

  thesis-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      # Typst comes from the `thesis` pixi feature, so CI and a working copy
      # build with the same version.
      # Warnings are failures here: an unresolved reference or an overflowing
      # box must not reach a PDF a supervisor reads. Graphviz sources are laid
      # out inside the document, so there is no figure-rendering step.
      - name: Build the thesis (warnings are errors)
        run: pixi run thesis-typst

      # Downloadable from the run, so a reviewer never has to install a
      # toolchain to see what a branch changed.
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thesis-pdf
          path: thesis/Voblint_Thesis.pdf
          if-no-files-found: error

  # Builds the site on every push to main and every manual run, so a branch can
  # exercise the whole pipeline without publishing anything.
  pages-site:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [isabelle-html, isabelle-pdf, thesis-pdf]
    runs-on: ubuntu-latest
    steps:
      # Full history: the site's commit heatmap counts every commit, and
      # pages_stats.py refuses a shallow clone rather than publish a partial one.
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      # The site's size figures count the vendored solver's theories and read its
      # ROOT for the session graph, so the Pages build needs that one submodule.
      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: '5'
          opam-pin: false

      - name: Install OCaml dependencies
        run: pixi run ocaml-deps-install

      - name: Download Isabelle HTML docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-html
          path: build/isabelle-html

      - name: Download formalization PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isabelle-pdf
          path: build/artifacts/isabelle-pdf

      - name: Download thesis PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thesis-pdf
          path: build/artifacts/thesis-pdf

      - name: Assemble GitHub Pages site
        env:
          HTML_SRC: build/isabelle-html
          FORMALIZATION_PDF: build/artifacts/isabelle-pdf/document.pdf
          THESIS_PDF: build/artifacts/thesis-pdf/Voblint_Thesis.pdf
        run: pixi run pages-site-build

      - name: Check the assembled site's internal links and theory anchors
        run: pixi run pages-site-links

      # The artifact pages-deploy publishes; downloadable from the run for inspection.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/github-pages

  pages-deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: pages-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A link in the thesis points at a page on GitHub Pages, so it can only be
  # validated once that page exists. This is the one check that sees what a
  # reader sees: it fetches every URL in the link map and verifies the page
  # responds *and* still carries the anchor the citation targets.
  thesis-links-live:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: pages-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      # Pages serves a new deployment with a short delay; the checker retries
      # with backoff rather than failing on the first miss.
      - name: Thesis links reach their definition on the published site
        run: pixi run thesis-links-live

      - name: Site page links reach their targets on the published site
        run: pixi run pages-links-live
