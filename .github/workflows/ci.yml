# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-isabelle-ascii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Isabelle ASCII-only sources
        run: |
          find src -name '*.thy' -print0 | xargs -0 python3 scripts/check_isabelle_ascii.py

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # GITHUB_TOKEN cannot clone other private repos (the td-verification fork).
      # Add a classic PAT with "repo" scope as secret SUBMODULES_TOKEN.
      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "::error title=Missing SUBMODULES_TOKEN::Create a classic PAT (repo scope) and add it as repository secret SUBMODULES_TOKEN so CI can clone the private td-verification fork."
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      - name: Build Goblint Formalization and HTML docs
        env:
          AFP_COMPONENT_BASE: ${{ env.AFP_COMPONENT_BASE }}
        run: |
          docker run --rm --user root \
            --entrypoint /bin/bash \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env AFP_COMPONENT_BASE \
            makarius/isabelle:Isabelle2025-2 \
            -ec '
              apt-get update -qq && apt-get install -y -qq git curl > /dev/null
              curl -fsSL https://pixi.sh/install.sh | bash
              export PATH="$HOME/.pixi/bin:$PATH"
              export ISABELLE=/home/isabelle/Isabelle/bin/isabelle
              export AFP="$AFP_COMPONENT_BASE"
              pixi run vendor
              pixi run html
              pixi run isabelle-lint
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              pixi run codegen-check
              $ISABELLE ocaml_setup
              pixi run codegen-ocaml-check
            '

      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/html
          retention-days: 1

  regression-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'

      - name: Install zarith (Code_Target_Numeral backs int/nat by Z.t)
        run: opam install -y zarith

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Compile and run codegen/regression drivers against codegen/generated/
        # ocaml/setup-ocaml@v3 puts `opam` itself on PATH but does not export the
        # switch's own bin dir (ocamlfind, ocamlopt) into later run steps' shells --
        # a plain `pixi run regression` sub-shell then can't find ocamlfind even
        # though opam install (also just `opam`, not a switch binary) succeeded
        # one step earlier. `opam exec --` activates the switch environment for
        # this invocation.
        run: opam exec -- pixi run regression

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
