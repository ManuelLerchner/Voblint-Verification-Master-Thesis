# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-isabelle-ascii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Isabelle ASCII-only sources
        run: |
          find src -name '*.thy' -print0 | xargs -0 python3 scripts/check_isabelle_ascii.py

  build:
    runs-on: ubuntu-latest
    # Runs the whole job inside the Isabelle image (replaces the previous
    # nested `docker run -ec '...'` single-step wrapper, which existed
    # because setup-isabelle-action's `isabelle getenv` calls only work
    # inside this image but the job wasn't actually scoped to it). Every
    # step below now runs natively in the same container, so later steps
    # keep the warm heaps `html` builds instead of needing to re-fetch a
    # toolchain per step.
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root

    steps:
      # The image has no git; actions/checkout and the submodule step below
      # both need it. The one unavoidable apt-get in this job.
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # GITHUB_TOKEN cannot clone other private repos (the td-verification fork).
      # Add a classic PAT with "repo" scope as secret SUBMODULES_TOKEN.
      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "::error title=Missing SUBMODULES_TOKEN::Create a classic PAT (repo scope) and add it as repository secret SUBMODULES_TOKEN so CI can clone the private td-verification fork."
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      # scripts/mk/require-afp.sh (sourced by every pixi task below) reads
      # $AFP, not $AFP_COMPONENT_BASE; bridge once instead of per-step.
      - name: Bridge AFP_COMPONENT_BASE to AFP
        run: echo "AFP=$AFP_COMPONENT_BASE" >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Apply td-verification compatibility patch
        run: pixi run vendor

      - name: Build HTML docs (clean build of every session)
        run: pixi run html

      - name: Isabelle community linter
        run: pixi run isabelle-lint

      - name: Codegen drift check
        run: pixi run codegen-check

      - name: Provision managed OCaml/zarith for Isabelle's own export check
        run: $ISABELLE ocaml_setup

      - name: Isabelle-native OCaml export_code check
        run: pixi run codegen-ocaml-check

      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/html
          retention-days: 1

  regression-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'

      - name: Install zarith + menhir (Code_Target_Numeral, and the voblint
          CLI/property-test parser generator)
        run: opam install -y zarith menhir

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Compile and run codegen/regression drivers against codegen/generated/
        # ocaml/setup-ocaml@v3 puts `opam` itself on PATH but does not export the
        # switch's own bin dir (ocamlfind, ocamlopt) into later run steps' shells --
        # a plain `pixi run regression` sub-shell then can't find ocamlfind even
        # though opam install (also just `opam`, not a switch binary) succeeded
        # one step earlier. `opam exec --` activates the switch environment for
        # this invocation.
        run: opam exec -- pixi run regression

      - name: External .vimp regression corpus (source -> parser -> analyse -> checks)
        run: opam exec -- pixi run cli-test

      - name: Parser/printer property tests (round-trip + mutation fuzzing)
        run: opam exec -- pixi run property

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
