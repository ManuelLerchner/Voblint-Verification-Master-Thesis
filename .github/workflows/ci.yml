# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-isabelle-ascii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Isabelle ASCII-only sources
        run: |
          find src -name '*.thy' -print0 | xargs -0 python3 scripts/check_isabelle_ascii.py

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # GITHUB_TOKEN cannot clone other private repos (the td-verification fork).
      # Add a classic PAT with "repo" scope as secret SUBMODULES_TOKEN.
      - name: Initialize td-verification submodule
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "::error title=Missing SUBMODULES_TOKEN::Create a classic PAT (repo scope) and add it as repository secret SUBMODULES_TOKEN so CI can clone the private td-verification fork."
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync vendor/td-verification
          git submodule update --init --depth 1 vendor/td-verification

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      - name: Build Goblint_Formalization and HTML docs
        env:
          AFP_COMPONENT_BASE: ${{ env.AFP_COMPONENT_BASE }}
        run: |
          docker run --rm --user root \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env AFP_COMPONENT_BASE \
            makarius/isabelle:Isabelle2025-2 \
            bash -ec '
              apt-get update -qq && apt-get install -y -qq git make > /dev/null
              ISABELLE=/home/isabelle/Isabelle/bin/isabelle
              make vendor
              make html AFP=$AFP_COMPONENT_BASE ISABELLE=$ISABELLE
            '

      - name: Upload GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/html
          retention-days: 1

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
