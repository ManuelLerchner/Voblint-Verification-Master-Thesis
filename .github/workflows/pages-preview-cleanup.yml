# SPDX-License-Identifier: MIT

name: Pages preview cleanup

on:
  pull_request:
    types: [ closed ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ci.yml publishes each pull request under pr-preview/pr-<n>/ on gh-pages;
  # a closed or merged PR no longer needs it.
  remove-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblint Formalization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      # A PR closed before its preview deployed has nothing to remove, and the
      # action fails rather than no-ops when gh-pages does not exist yet.
      - name: Check for a published preview
        id: preview
        env:
          PREVIEW: pr-preview/pr-${{ github.event.number }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null \
             && git fetch -q --depth 1 origin gh-pages \
             && git ls-tree -d --name-only FETCH_HEAD -- "$PREVIEW" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $PREVIEW on gh-pages; nothing to remove."
          fi

      - name: Remove the preview and update the PR comment
        if: steps.preview.outputs.exists == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
