# Prose lint for the thesis: `pixi run prose-lint`.
#
# Voblint (.vale/styles/Voblint) encodes the writing rules of AGENTS.md,
# thesis/CLAUDE.md and docs/SITE_VOICE.md; each rule names its source.
# Harper adds grammar checks. Of ai-tells only the rules below are on: the
# rest flag mathematical quantifiers ("every"), technical verbs ("reaches",
# "holds", "terminates") and the discourse markers thesis/CLAUDE.md asks for.
# Vale's spell check is off; typos covers spelling.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Harper, ai-tells

[*.typ]
BasedOnStyles = Voblint, Harper

ai-tells.ServesAsDodge = YES
ai-tells.ExplainerLeads = YES
ai-tells.FillerPhrases = YES
ai-tells.HedgingPhrases = YES
ai-tells.RestatementMarkers = YES
ai-tells.FigurativeIdioms = YES
ai-tells.JourneyMetaphors = YES
ai-tells.FigurativeQuantities = YES
ai-tells.EmptyPadding = YES
ai-tells.SummativeAppositive = YES
ai-tells.SemicolonUsage = YES
