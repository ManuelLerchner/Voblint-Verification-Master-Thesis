# Prose lint: `pixi run -e prose prose-lint`.
#
# This file says what to check; scripts/mk/prose-lint.sh says which files.
#
# Severity policy: error is project policy and fails the run, warning is a
# likely problem to review, suggestion is a context-dependent preference.
# Upstream heuristics are lowered to warning or suggestion, since a match
# does not prove the sentence wrong.
#
# Packages only installs styles (`vale sync`); BasedOnStyles turns a whole
# style on, and `Style.Rule = <level>` turns on a single rule at that level.
# Each package is pinned to a release so a sync cannot change the results.
#   Voblint   .vale/styles/Voblint: the rules of AGENTS.md, thesis/CLAUDE.md
#             and docs/SITE_VOICE.md, each file naming its source
#   Harper    grammar
#   ai-tells  only the rules below: the rest flag mathematical quantifiers
#             ("every"), technical verbs ("reaches", "holds", "terminates")
#             and the discourse markers thesis/CLAUDE.md asks for
#   Journals  only its general scientific-writing rules below
# Vale's spell check stays off; typos covers spelling.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/vale-cli/Harper/releases/download/v0.1.0/Harper.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/jdkato/journals/releases/download/v0.1.0/Journals.zip

# Vale has no LaTeX parser. Read .tex as Markdown, which already skips $...$
# math, and strip the LaTeX it does not know with the ignores below.
[formats]
tex = md

[*.{typ,tex}]
BasedOnStyles = Voblint, Harper

# "Most precise" is the field's term, and "therefore" inside a sentence takes
# no comma.
Harper.MoreAdjective4 = NO
Harper.MoreAdjective5 = NO
Harper.DiscourseMarkers = NO
# Related work compares named authors' results, where the authors are the
# subject.
Voblint.CitationSubject = NO
# Its matches here ("in lockstep", "closes the gap", "what remains of") were
# literal.
ai-tells.FigurativeIdioms = NO

ai-tells.ServesAsDodge = warning
ai-tells.ExplainerLeads = warning
ai-tells.FillerPhrases = warning
ai-tells.HedgingPhrases = warning
ai-tells.RestatementMarkers = warning
ai-tells.FigurativeQuantities = warning
ai-tells.EmptyPadding = warning
ai-tells.SummativeAppositive = warning

Journals.Positional = warning
Journals.FigureAbbreviation = suggestion
Journals.LabelCase = warning
Journals.Placeholder = error
Journals.DoubleHedge = suggestion
# Intensifiers would repeat Voblint.Obviously on clearly/obviously/of course.
Journals.SentenceNumeral = warning
Journals.UnitSpacing = warning
Journals.EtAl = warning

[*.typ]
# A citation's page or theorem locator: typst2vast drops the key but keeps
# "[p. 44]", which then reads as a sentence opening with a numeral.
# Isabelle release names, which read as a numeric range, and Isabelle session
# heaps, which read as a quantity.
TokenIgnores = (@[A-Za-z0-9_:.-]+\[[^\]]*\]), \
  (Isabelle20[0-9]{2}(?:-[0-9]+)?), \
  (\bheaps of\b)

[*.tex]
# Non-prose environments and display math. RE2 has no backreferences, so
# each environment is listed.
BlockIgnores = (?s)(\\begin\{tikzpicture\}.*?\\end\{tikzpicture\}), \
  (?s)(\\begin\{tabular\}.*?\\end\{tabular\}), \
  (?s)(\\begin\{array\}.*?\\end\{array\}), \
  (?s)(\\begin\{verbatim\}.*?\\end\{verbatim\}), \
  (?s)(\\begin\{equation\*?\}.*?\\end\{equation\*?\}), \
  (?s)(\\begin\{align\*?\}.*?\\end\{align\*?\}), \
  (?s)(\\begin\{gather\*?\}.*?\\end\{gather\*?\}), \
  (?s)(\\begin\{multline\*?\}.*?\\end\{multline\*?\}), \
  (?s)(\\\[.*?\\\]), \
  (?m)((?:^[ \t]*%.*\n)+)
# Commands whose argument is a name, key or path, then any other command name
# with its optional argument (the braced argument stays, as it is prose), and
# trailing comments.
TokenIgnores = (\\(?:cite[tp]?|[cC]ref|ref|autoref|label|isaname|snippet|input|include|stat|url|texttt|ctor|verdict|oblig|todo)\*?(?:\[[^\]]*\])?\{[^}]*\}), \
  (\\[a-zA-Z@]+\*?(?:\[[^\]]*\])?), \
  ([^\\]%[^\n]*)
