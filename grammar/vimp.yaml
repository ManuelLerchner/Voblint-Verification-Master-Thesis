# Canonical VIMP source grammar (M2 of the grammar-unification investigation).
#
# This is a *language* description, not a Menhir grammar: precedence and
# associativity are declared once, generically, and each target (Menhir,
# Isabelle syntax, the property-test generator, the printer) is responsible
# for realizing that into its own idiom. In particular this file does not
# introduce `term`/`atom` precedence-tier nonterminals -- those are a
# parser-implementation technique (needed by hand-written recursive descent,
# realizable in Menhir via %left/%right instead), not part of the language.
#
# `program { ... }` is not part of this grammar. A standalone source file is
# EOF-delimited; wrapping VIMP inside a HOL term (e.g. an Isabelle
# `vimp_program \<lbrakk> ... \<rbrakk>` quotation) is a target-specific
# embedding concern, layered on top of `program` by the Isabelle generator
# only.
#
# `main` is NOT a reserved keyword: both existing systems already agree on
# this -- VIMP_Notation.thy's parse_translation (prog_tr) and
# cli/vimp_parser.ml's `program` both parse every function uniformly as an
# ordinary identifier and pick out "main" by string equality afterward
# (`List.partition (fn (n,_,_,_) => n = "main")` / the OCaml equivalent), not
# via a distinct lexical token. An earlier draft of this grammar introduced
# `main: MAIN` and a structural `main_decl` production, which was a genuine
# deviation from both existing parsers, not a simplification of them; fixed
# to match.
#
# Locating `main` is nonetheless still done during parsing/lowering here
# (`special: program_structure`), for early, precise parse-time diagnostics
# (missing/duplicate `main`, wrong arity) rather than a deferred
# well-formedness failure. `imp_prog`'s `proc_rep` carries `main` as an
# ordinary entry -- nothing structural forces a `program { ... }`
# construction to include one -- so `wf_program_source`'s own
# `Pi mnm = Some (proc_decl_of [] main)` conjunct is what makes "main
# present, with no formals" a proof obligation on a given `imp_prog` value;
# the parser's checks are a UX convenience on top, not what discharges it.
#
# Old semantic validation that has no structural encoding (duplicate
# procedure/global/formal names, global/formal collisions, main-formals,
# main-return) is not preserved: it was never part of the grammar in the
# first place, and this investigation's scope note says not to keep it.
#
# Every production's AST-construction is exactly one of three shapes:
#
#   lower: {ctor: Name, args: [...]}
#     Structured constructor application. Each entry in `args` is one of:
#       {rhs: N}         -- the parsed value at rhs position N
#       {some: <arg>}    -- that arg wrapped in `Some`
#       {none: true}     -- literal `None`
#       {literal: true|false} -- a literal boolean
#       {int: N}         -- a literal int (used by exp_true/exp_false to
#         lower straight to N 1/N 0 -- exp has no separate Boolean literal
#         constructor, so a keyword literal still needs a way to reach a
#         fixed integer argument without going through a parsed rhs position)
#     `{tuple: [i, j, ...]}` builds an OCaml tuple from those rhs positions
#     instead of applying a constructor (function_decl's (name, formals,
#     body), not an algebraic-datatype constructor).
#
#   passthrough: N
#     Transparent syntax: the parsed value at rhs position N, unchanged --
#     grouping parens (exp_paren) and a `global ...;` line's
#     own name list (globals_decl), where the production exists only to
#     constrain what can appear around a value, not to build a new one.
#
#   special: name
#     Genuinely non-generic lowering, hardcoded in the generator (keyed by
#     `name`, not per-production) rather than forced through the structured
#     template above:
#   - integer_literal: converts the lexer's raw OCaml int into the exported
#     Isabelle int representation (Int_of_integer (Z.of_int n)) -- a type
#     conversion, not a constructor application; the only place this is
#     needed, not worth a general conversion mechanism in `lower:` for one
#     call site.
#   - unary minus: folds into N(-n) for a numeral operand, Minus(N 0, x)
#     otherwise. This is the canonical lowering rule (settled during M4):
#     compositional, no algebraic simplification at parse time, so it
#     deliberately does NOT special-case a nested uminus the way Isabelle's
#     current parse_translation does (`_imp2_uminus (_imp2_uminus b) =>
#     exp_tr b`, cancelling `--x` to `x`) -- under this rule `--x` lowers
#     to `Minus (N 0) (Minus (N 0) (V x))` instead, same integer semantics,
#     just not re-simplified during parsing. When Isabelle generation lands
#     (M6), that cancellation case should be deleted from parse_translation
#     to match, not replicated here. Grammar and algebraic normalization
#     are kept as separate concerns; if AST normalization is wanted later,
#     it belongs in its own explicit pass, not hidden inside one frontend.
#   - program: partitions the uniformly-parsed function_decl* list into
#     "main" and everything else by string equality, matching both existing
#     parsers (see below).

terminals:
  ident:
    token: IDENT
    lex: "[a-zA-Z_][a-zA-Z0-9_]*"
    excludes_keywords: true
  int_const:
    token: INT
    lex: "[0-9]+"

keywords:
  global: GLOBAL
  void: VOID
  skip: SKIP
  return: RETURN
  __voblint_check: CHECK
  if: IF
  else: ELSE
  while: WHILE
  "true": BOOL_TRUE
  "false": BOOL_FALSE
  # Machine-integer kinds (stdint-style). A declaration's type annotation
  # is optional everywhere it may appear -- an unannotated declaration
  # means `int32` -- so every pre-kind program still parses unchanged.
  # Deliberately NO bare `int`/`uint` alias keywords: an Isabelle mixfix
  # literal becomes an inner-syntax delimiter in every importing theory,
  # so an `int` keyword would shadow HOL's own `int` type token
  # repo-wide. The default supplies the `int` meaning instead.
  int8: TINT8
  uint8: TUINT8
  int16: TINT16
  uint16: TUINT16
  int32: TINT32
  uint32: TUINT32
  int64: TINT64
  uint64: TUINT64

punctuation:
  ":=": ASSIGN
  "+": PLUS
  "-": MINUS
  "*": STAR
  "<": LT
  "==": EQEQ
  "&&": AND
  "||": OR
  "!": NOT
  "{": LBRACE
  "}": RBRACE
  "(": LPAREN
  ")": RPAREN
  ";": SEMI
  ",": COMMA

# Lowest to highest binding. Each entry becomes one Menhir %left/%right/
# %nonassoc line, in this order (Menhir's convention: later = binds
# tighter). `UMINUS` is a synthetic precedence level, not a token, used only
# to give the unary-minus production's %prec annotation somewhere to point.
precedence:
  - {assoc: left,  tokens: ["OR"]}
  - {assoc: left,  tokens: ["AND"]}
  - {assoc: none,  tokens: ["LT", "EQEQ"]}
  - {assoc: left,  tokens: ["PLUS", "MINUS"]}
  - {assoc: left,  tokens: ["STAR"]}
  - {assoc: right, tokens: ["NOT", "UMINUS"]}

productions:
  # -- exp: flat, left-associative via precedence declarations, no term/atom
  # split, and no separate Boolean AST -- comparisons/logical operators are
  # ordinary exp productions that happen to yield 0/1 (see VIMP_Expr.thy's
  # `aval`/`truthy`), not a parallel bexp nonterminal. --
  - {name: exp_var,   result: exp, rhs: [IDENT], lower: {ctor: V, args: [{rhs: 0}]}}
  - {name: exp_num,   result: exp, rhs: [INT],   special: integer_literal}
  - {name: exp_uminus, result: exp, rhs: [MINUS, exp], special: unary_minus, precedence: UMINUS}
  - {name: exp_plus,  result: exp, rhs: [exp, PLUS, exp],  precedence: PLUS,
     lower: {ctor: Plus, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_minus, result: exp, rhs: [exp, MINUS, exp], precedence: MINUS,
     lower: {ctor: Minus, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_times, result: exp, rhs: [exp, STAR, exp],  precedence: STAR,
     lower: {ctor: Times, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_true,  result: exp, rhs: [BOOL_TRUE],  lower: {ctor: N, args: [{int: 1}]}}
  - {name: exp_false, result: exp, rhs: [BOOL_FALSE], lower: {ctor: N, args: [{int: 0}]}}
  - {name: exp_less,  result: exp, rhs: [exp, LT, exp],   lower: {ctor: Less, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_eq,    result: exp, rhs: [exp, EQEQ, exp], lower: {ctor: Eq,  args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_not,   result: exp, rhs: [NOT, exp], precedence: NOT,
     lower: {ctor: Not, args: [{rhs: 1}]}}
  - {name: exp_and,   result: exp, rhs: [exp, AND, exp], precedence: AND,
     lower: {ctor: And, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_or,    result: exp, rhs: [exp, OR, exp], precedence: OR,
     lower: {ctor: Or, args: [{rhs: 0}, {rhs: 2}]}}
  # Transparent grouping (no AST constructor), so the precedence table alone
  # determines both what a printer must parenthesize and what the
  # property-test generator may produce: any exp tree is now
  # source-expressible, not just left-associated ones. Isabelle's own exp
  # grammar (VIMP_Notation.thy) and the shipped cli/vimp_parser.ml still have
  # no such production -- extending those is a real language-cutover
  # decision (M6+), not part of this prototype.
  - {name: exp_paren,  result: exp, rhs: [LPAREN, exp, RPAREN],   passthrough: 1}

  # -- stmt --
  - {name: stmt_skip,     result: stmt, rhs: [SKIP], lower: {ctor: SKIP, args: []}}
  - {name: stmt_assign,   result: stmt, rhs: [IDENT, ASSIGN, exp],
     lower: {ctor: Assign, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: stmt_return,   result: stmt, rhs: [RETURN, exp],
     lower: {ctor: Return, args: [{some: {rhs: 1}}]}}
  - {name: stmt_return0,  result: stmt, rhs: [RETURN],
     lower: {ctor: Return, args: [{none: true}]}}
  - {name: stmt_check,    result: stmt, rhs: [CHECK, LPAREN, exp, RPAREN],
     lower: {ctor: Check, args: [{rhs: 2}]}}
  - {name: stmt_if,       result: stmt, rhs: [IF, LPAREN, exp, RPAREN, LBRACE, stmts_opt, RBRACE, ELSE, LBRACE, stmts_opt, RBRACE],
     lower: {ctor: If, args: [{rhs: 2}, {rhs: 5}, {rhs: 9}]}}
  - {name: stmt_while,    result: stmt, rhs: [WHILE, LPAREN, exp, RPAREN, LBRACE, stmts_opt, RBRACE],
     lower: {ctor: While, args: [{rhs: 2}, {rhs: 5}]}}
  # No separate call0/callret0 (zero-arg) productions: unlike Isabelle's
  # imp2_actuals (which has no empty derivation, forcing _imp2_call0 as a
  # workaround), this grammar's `actuals` already allows `min: 0`, so
  # `f()`/`x := f()` already parse via `stmt_call`/`stmt_callret` with an
  # empty actuals list. A separate call0/callret0 would just be ambiguous
  # with that (confirmed empirically: Menhir reported exactly this as a
  # shift/reduce conflict on RPAREN when both were present).
  - {name: stmt_call,     result: stmt, rhs: [IDENT, LPAREN, actuals, RPAREN],
     lower: {ctor: Call, args: [{none: true}, {rhs: 0}, {rhs: 2}]}}
  - {name: stmt_callret,  result: stmt, rhs: [IDENT, ASSIGN, IDENT, LPAREN, actuals, RPAREN],
     lower: {ctor: Call, args: [{some: {rhs: 0}}, {rhs: 2}, {rhs: 4}]}}

  # -- machine-integer kinds: keyword-led atoms lowering to `ikind`
  # constructors (explicit widths only -- see the keyword table on why no
  # bare `int`/`uint` aliases exist). --
  - {name: ty_int8,   result: ty, rhs: [TINT8],   lower: {ctor: I8,  args: []}}
  - {name: ty_uint8,  result: ty, rhs: [TUINT8],  lower: {ctor: U8,  args: []}}
  - {name: ty_int16,  result: ty, rhs: [TINT16],  lower: {ctor: I16, args: []}}
  - {name: ty_uint16, result: ty, rhs: [TUINT16], lower: {ctor: U16, args: []}}
  - {name: ty_int32,  result: ty, rhs: [TINT32],  lower: {ctor: I32, args: []}}
  - {name: ty_uint32, result: ty, rhs: [TUINT32], lower: {ctor: U32, args: []}}
  - {name: ty_int64,  result: ty, rhs: [TINT64],  lower: {ctor: I64, args: []}}
  - {name: ty_uint64, result: ty, rhs: [TUINT64], lower: {ctor: U64, args: []}}

  # -- formal parameters: an optionally kind-annotated name. Both targets
  # lower a formal to a (name, kind option) pair; the program assembly
  # keeps the names for `proc_decl` and collects the annotated kinds into
  # the program's declared-kind list. Optionality is two productions, not
  # an empty derivation: Isabelle mixfix has no epsilon (the same
  # constraint the header records for zero-argument calls). --
  - {name: formal_untyped, result: formal, rhs: [IDENT], special: formal_untyped}
  - {name: formal_typed,   result: formal, rhs: [ty, IDENT], special: formal_typed}

  # -- procedure-local declarations. One line per kind, applying to every
  # name it lists, mirroring `globals_decl_typed`. Unlike a global, a local
  # has no untyped form: an unannotated `x;` would be a bare IDENT statement
  # rather than a keyword-led declaration, and the whole point of declaring
  # locals is that a local's kind stops being inferred from a program-wide
  # default.
  #
  # Declarations form a prologue: `function_decl` puts `locals_star` before
  # `stmts_opt`, so a declaration after the first statement is a parse error.
  # Interleaving them would mean hosting a declaration inside `stmt`, which is
  # ambiguous against an `IDENT`-led statement unless a locals list is threaded
  # back out of `stmts`. Scoping is unaffected either way: VIMP has no block
  # syntax, so every local is visible throughout its procedure, and "declared
  # before use" means "present in this procedure's declaration list" rather
  # than anything order-sensitive. --
  - {name: local_decl, result: local, rhs: [ty, ids, SEMI], special: locals_typed}

  # -- statement sequences, actuals, formals, ids: standard left-recursive lists --
  - {name: stmts, result: stmts, list_of: stmt, separator: SEMI, constructor: Seq, min: 1}
  - {name: stmts_opt, result: stmts_opt, optional_list_of: stmt, separator: SEMI, constructor: Seq, empty: SKIP}
  - {name: actuals, result: actuals, list_of: exp, separator: COMMA, min: 0}
  - {name: formals, result: formals, list_of: formal, separator: COMMA, min: 0}
  - {name: ids,      result: ids,     list_of: IDENT, separator: COMMA, min: 1}

  # -- globals, functions, program. A program may carry any number of
  # `global` lines (so differently-kinded globals are declarable); each
  # line optionally carries one kind applying to every name it lists. --
  - {name: globals_decl, result: globals, rhs: [GLOBAL, ids, SEMI], special: globals_untyped}
  - {name: globals_decl_typed, result: globals, rhs: [GLOBAL, ty, ids, SEMI], special: globals_typed}
  - {name: function_decl, result: function,
     rhs: [VOID, IDENT, LPAREN, formals, RPAREN, LBRACE, locals_star, stmts_opt, RBRACE],
     lower: {tuple: [1, 3, 6, 7]}}   # (name, formals, locals, body) -- "main" is just an IDENT here, same as every other name

  # Every function parses uniformly via function_decl*; "main" is picked out
  # of the resulting list by string equality during lowering (matching both
  # existing parsers -- see this file's header), not by a grammar-level
  # main_decl production.
  - {name: program, result: program, rhs: [globals_star, function_decl_star, EOF],
     special: program_structure}
