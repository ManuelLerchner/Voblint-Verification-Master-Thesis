# The analysis registry.
#
# This file answers four questions and nothing else:
#
#   1. Which verified implementation is this domain?
#   2. Which solver and context combinations does it publish?
#   3. Which combination is the default?
#   4. Which API capabilities does each published combination expose?
#
# How those choices become theories, bindings, proofs and dispatch equations is
# the generator's decision, not a per-domain setting. Domain rationale -- why a
# lattice has finite height, why a solver choice matters here -- belongs in the
# domain's README, not in registration data.
#
# `legacy:` is the one exception, and it is deliberately quarantined: it maps
# the uniform interface onto spellings that predate it. Every entry there is a
# rename waiting to happen, not an extension point. Nothing outside `legacy:`
# names an existing identifier that a convention could have produced.

# The CLI tables are generated but not adopted: `Analyse_Dispatch` and
# `Analysis_Config` still own those equations by hand, and adopting them needs a
# handwritten carrier theory for `abstract_value` and `tag_states` first. Until
# this says true, the generator renders them only under `--out` and the drift
# check ignores them, so neither an accidental run nor the ci gate can put an
# unadopted theory into the tree.
# Adoption is per output. An unadopted one renders under `--out` and is neither
# written into the tree nor compared by the drift gate, so a commit that adds
# the generator does not turn ci red for files a later commit adds. Flip the
# flag in the same commit that checks the output in.
cli_adopted: false

solvers:
  always_join:
    title: Always join
    interp: TD_side_always_join_Interp
    constructor: Solver_Join
  per_origin:
    title: Per origin
    interp: TD_side_per_origin_Interp
    constructor: Solver_PerOrigin
  warrowing_apinis:
    title: Apinis warrowing
    interp: TD_side_warrowing_apinis_Interp
    constructor: Solver_Warrow
  warrowing_per_origin:
    title: Warrowing per origin
    interp: TD_side_warrowing_per_origin_Interp
    constructor: Solver_WarrowPerOrigin

# `min_bound` on a call-string context is the shortest bound the domain
# publishes. It is 1 everywhere today, and that is a usability decision rather
# than a soundness one: `cs_route 0` routes every activation to the empty
# context, as well-defined and as finite as any other bound. Lowering it is a
# real behaviour change -- a call-string-keyed result whose contexts are all
# empty is not `Ctx_None` -- so it belongs in its own change with its own
# theorems, not in a table swap meant to preserve behaviour.
domains:
  - name: Sign
    adopted: true
    value_type: sign
    tag: SignValue
    # Ordered. The first route is the production instance: it publishes the
    # full name set and the others are proved to solve its equation system.
    routes: [always_join, per_origin]
    contexts:
      entry_state: {solvers: [always_join], default: always_join}
      call_string: {solvers: [always_join], default: always_join, min_bound: 1}
    legacy:
      impl_prefix: sign
      classifier: sign_classify_check
      init_gamma: sign_cinit_gamma
      extra_imports: ['"Voblint_VIMP.VIMP_Notation"']
      hide_consts: [phase.N]
      binders: {always_join: sign_join, per_origin: sign_po_asm}
      prefixes: {always_join: sign_unit, per_origin: sign_po}
      routes:
        always_join:
          report: analyse_sign_report
          report_with_state: analyse_sign_report_with_state
        per_origin:
          report: analyse_sign_report_per_origin
          report_with_state: sign_per_origin.report_with_state

  - name: Interval
    adopted: true
    value_type: ivl
    tag: IntervalValue
    routes: [warrowing_apinis, always_join, per_origin, warrowing_per_origin]
    contexts:
      entry_state:
        solvers: [always_join, per_origin, warrowing_apinis, warrowing_per_origin]
        default: warrowing_apinis
      call_string:
        solvers: [always_join, per_origin, warrowing_apinis, warrowing_per_origin]
        default: warrowing_apinis
        min_bound: 1
    legacy:
      impl_prefix: ivl
      classifier: interval_classify_check
      init_gamma: interval_cinit_gamma
      binders:
        warrowing_apinis: interval_warrow_asm
        always_join: interval_join_asm
        per_origin: interval_po_asm
        warrowing_per_origin: interval_wpo_asm
      prefixes:
        warrowing_apinis: interval_td
        always_join: interval_join
        per_origin: interval_po
        warrowing_per_origin: interval_wpo
      routes:
        warrowing_apinis:
          report: analyse_interval_td_report
          report_with_state: analyse_interval_td_report_with_state
        always_join:
          report: analyse_interval_report
          report_with_state: interval_join.report_with_state
        per_origin:
          report: analyse_interval_report_per_origin
          report_with_state: interval_per_origin.report_with_state
        warrowing_per_origin:
          report: analyse_interval_report_wpo
          report_with_state: interval_wpo.report_with_state

  - name: Parity
    adopted: true
    value_type: parity
    tag: ParityValue
    routes: [always_join, per_origin]
    legacy:
      impl_prefix: parity
      classifier: parity_classify_check
      init_gamma: parity_cinit_gamma
      # Parity's own commutation theorem is unconditional, which is stronger
      # than the registration shape obligation 2 cites into and therefore not
      # citable there. The domain keeps the sharper theorem and owns this
      # corollary; registration names the corollary.
      facts:
        tf_commute: parity_tf_st_for_commute_if_live
      binders: {always_join: parity_join, per_origin: parity_po_asm}
      prefixes: {always_join: parity_unit, per_origin: parity_po}
      routes:
        always_join:
          report: analyse_parity_report
          report_with_state: analyse_parity_report_with_state
        per_origin:
          report: analyse_parity_report_per_origin
          report_with_state: parity_per_origin.report_with_state

  # Int is registered for dispatch only. `assembly: false` records that the
  # migration has not reached it yet -- it still runs its own pipeline, so it
  # has no generated assembly theory and its routes are named rather than
  # derived. It is not a claim that Int cannot meet the interface; nothing here
  # has established that either way.
  - name: Int
    # Int's operations carry a refinement mode, so its roles are applications
    # rather than bare names. The published route interprets at the production
    # mode; Int_Entry keeps a mode-generic layer of its own, so the arbitrary-mode
    # API does not narrow.
    adopted: true
    value_type: int_dom
    tag: IntDomValue
    routes: [warrowing_apinis, always_join, per_origin, warrowing_per_origin]
    contexts:
      entry_state:
        solvers: [always_join, warrowing_apinis]
        default: warrowing_apinis
      call_string:
        solvers: [always_join, warrowing_apinis]
        default: warrowing_apinis
        min_bound: 1
    legacy:
      impl_prefix: int
      classifier: int_classify_check
      init_gamma: int_cinit_gamma
      facts:
        tf_st: {const: int_tf_st_for, args: [Refine_Fixpoint]}
        enter_st: {const: int_dom_enter_st_for, args: [Refine_Fixpoint]}
        init_st: cinit_int_dom_st
        skip: skip_int_dom
        assign: {const: assign_int_dom, args: [Refine_Fixpoint]}
        special: {const: special_int_dom, args: [Refine_Fixpoint]}
        branch: {const: branch_int_dom_for, args: [Refine_Fixpoint]}
        body: body_int_dom
        return: {const: return_int_dom, args: [Refine_Fixpoint]}
        enter_ci: {const: enter_int_dom_ci_for, args: [Refine_Fixpoint]}
        event: event_int_dom
        transfer_sound: int_is_sound_transfer_for
        tf_commute: int_tf_st_for_commute
        tf_abs_def: int_tf_abs_def
        enter_commute: int_dom_enter_st_for_commute
      binders:
        warrowing_apinis: int_warrow_asm
        always_join: int_join_asm
        per_origin: int_po_asm
        warrowing_per_origin: int_wpo_asm
      prefixes:
        warrowing_apinis: int_unit
        always_join: int_join
        per_origin: int_po
        warrowing_per_origin: int_wpo
      routes:
        warrowing_apinis:
          report: analyse_int_report
          report_with_state: analyse_int_report_with_state
        always_join:
          report: analyse_int_report_join
          report_with_state: int_join.report_with_state
        per_origin:
          report: analyse_int_report_per_origin
          report_with_state: int_per_origin.report_with_state
        warrowing_per_origin:
          report: analyse_int_report_wpo
          report_with_state: int_wpo.report_with_state

  # Congruence publishes on its own, alongside its role as the fourth component
  # of `int_dom`. Its widening is plain join (the modulus only ever coarsens, so
  # an ascending chain is a divisor chain and terminates), which is why it
  # publishes the same two disciplines Sign and Parity do rather than a
  # warrowing route: there is nothing for widening to accelerate.
  - name: Congruence
    adopted: true
    value_type: congruence
    tag: CongruenceValue
    routes: [always_join, per_origin]
    contexts:
      entry_state: {solvers: [always_join], default: always_join}
      call_string: {solvers: [always_join], default: always_join, min_bound: 1}
    legacy:
      impl_prefix: congruence
      classifier: congruence_classify_check
      init_gamma: congruence_cinit_gamma
      hide_consts: [phase.N]
      binders: {always_join: congruence_join, per_origin: congruence_po_asm}
      prefixes: {always_join: congruence_unit, per_origin: congruence_po}
      routes:
        always_join:
          report: analyse_congruence_report
          report_with_state: analyse_congruence_report_with_state
        per_origin:
          report: analyse_congruence_report_per_origin
          report_with_state: congruence_per_origin.report_with_state
