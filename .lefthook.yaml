# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
#
# Install with `pixi run hooks-install`.
#
# Pre-commit:
#   Formats staged files and restages them, then runs fast/static repository
#   invariants and generated-artifact drift checks.
#
# Pre-push:
#   Heavier checks that make sure thesis material still agrees with the
#   formalization, generated analyzer, and rendered document.
#
# The full supported verification gate remains `pixi run verify`.

output: [summary]

# Lefthook's default glob matcher gives `**` non-standard semantics:
# it matches one-or-more directories rather than zero-or-more. Most patterns
# below intentionally use the conventional recursive meaning.
glob_matcher: doublestar


# No `fail_on_changes`: it hashes worktree contents across the whole hook, so
# it would reject every fix a formatter below writes. Each drift check fails on
# its own instead.
pre-commit:
  jobs:
    # ----------------------------------------------------------------------
    # Generated artifacts
    #
    # These checks may regenerate tracked artifacts in place. Run them before
    # read-only checks so the latter always inspect the resulting tree.
    # ----------------------------------------------------------------------
    - name: generated-artifacts
      group:
        parallel: true
        jobs:
          - name: vimp-isabelle-grammar-drift
            glob:
              - "manifests/vimp-grammar.yaml"
              - "scripts/gen_vimp_isabelle.py"
              - "src/Program_Model/VIMP/VIMP_Grammar_Generated.thy"
            run: pixi run grammar-isabelle-check

          - name: vimp-menhir-grammar-drift
            glob:
              - "manifests/vimp-grammar.yaml"
              - "scripts/gen_vimp_menhir.py"
              - "cli/frontend/vimp_parser.mly"
              - "cli/frontend/vimp_lexer.mll"
            run: pixi run grammar-menhir-check

          - name: vimp-printer-grammar-drift
            glob:
              - "manifests/vimp-grammar.yaml"
              - "scripts/gen_vimp_printer.py"
              - "cli/frontend/vimp_printer.ml"
            run: pixi run grammar-printer-check

          - name: analysis-assembly-drift
            glob:
              - "manifests/analyses.yaml"
              - "scripts/gen_analysis_assembly.py"
              - "src/Analyses/**/*.thy"
            run: pixi run assembly-check

    # ----------------------------------------------------------------------
    # Formatters
    #
    # `stage_fixed` restages the staged files a formatter rewrote; lefthook
    # hides unstaged hunks of partially staged files meanwhile, so only staged
    # content is formatted and committed. Ruff and biome take the staged files;
    # the others format their whole scope. CI still runs the `-check` tasks.
    # ----------------------------------------------------------------------
    - name: formatters
      group:
        parallel: true
        jobs:
          - name: python-format
            glob: "**/*.py"
            run: pixi run python-format -- {staged_files}
            stage_fixed: true

          - name: ocaml-format
            glob:
              - "**/*.ml"
              - "**/*.mli"
              - "**/dune"
              - "dune-project"
            run: pixi run ocaml-format
            stage_fixed: true

          - name: typst-format
            glob: "**/*.typ"
            run: pixi run typst-format
            stage_fixed: true

          - name: toml-format
            glob: "**/*.toml"
            run: pixi run toml-format
            stage_fixed: true

          - name: pages-format
            glob:
              - "pages/**/*.js"
              - "pages/**/*.css"
            run: pixi run pages-format -- {staged_files}
            stage_fixed: true

    # ----------------------------------------------------------------------
    # Fast repository invariants
    # ----------------------------------------------------------------------
    - name: invariant-checks
      group:
        parallel: true
        jobs:
          # Keep the verification task graph itself honest. This is broad on
          # purpose: changes to tasks, CI, scripts, or their descriptions can
          # otherwise make local `verify` and GitHub CI silently diverge.
          - name: verification-task-surface
            glob:
              - ".github/**/*.yaml"
              - ".github/**/*.yml"
              - ".lefthook.yaml"
              - "**/*.md"
              - "**/*.ml"
              - "**/*.mli"
              - "**/*.mll"
              - "**/*.mly"
              - "**/*.py"
              - "**/*.sh"
              - "**/*.thy"
              - "**/*.toml"
              - "**/*.yaml"
              - "**/*.yml"
            run: pixi run verification-surface-check

          # ----------------------------------------------------------------
          # Linting
          #
          # Ruff takes the staged files; the other tools are fast enough to
          # check their whole scope, which also catches a config change.
          # ----------------------------------------------------------------

          - name: python-lint
            glob: "**/*.py"
            run: pixi run python-lint -- {staged_files}

          # A formatter config change can reformat files that are not staged,
          # which `stage_fixed` leaves out of the commit; fail instead so
          # `pixi run format` gets run. biome.jsonc is covered by pages-lint.
          - name: formatter-config
            glob:
              - ".ocamlformat"
              - ".ocamlformat-ignore"
              - "ruff.toml"
              - ".taplo.toml"
            run: pixi run python-format-check && pixi run ocaml-format-check && pixi run toml-format-check

          - name: opam-lint
            glob: "*.opam"
            run: pixi run opam-lint

          - name: shell-lint
            glob:
              - "**/*.sh"
              - ".shellcheckrc"
            run: pixi run shell-lint

          - name: actions-lint
            glob:
              - ".github/**/*.yml"
              - ".github/**/*.yaml"
            run: pixi run actions-lint

          - name: markdown-lint
            glob:
              - "**/*.md"
              - ".markdownlint-cli2.yaml"
            run: pixi run markdown-lint

          - name: spelling
            glob:
              - "**/*.{md,typ,py,ml,mli,sh,toml,yaml,yml}"
              - "_typos.toml"
            run: pixi run spelling-check

          - name: pages-lint
            glob:
              - "pages/**/*.js"
              - "pages/**/*.css"
              - "biome.jsonc"
            run: pixi run pages-lint

          - name: isabelle-ascii
            glob: "**/*.thy"
            run: pixi run isabelle-ascii-check -- {staged_files}

          # ROOT mistakes are cheap to detect and can otherwise make jEdit or
          # Isabelle fail far away from the actual edit.
          - name: sessions
            glob:
              - "**/ROOT"
              - "**/ROOTS"
              - "src/**/*.thy"
            run: pixi run sessions-check

          # The regression linter is intentionally build-free. It checks
          # fixture filenames, PARAM headers, directory classification,
          # verdict annotations, graph blocks, and related metadata before
          # we spend time compiling the CLI.
          #
          # This would have caught the PR #190 ADC fixture immediately.
          - name: regression-fixtures
            glob:
              - "tests/run.py"
              - "tests/regression/**/*.vimp"
            run: pixi run regression-lint

          # PDF session selection is also pure Python. Catch ROOT/import
          # mistakes before paying for an Isabelle document build.
          - name: pdf-session-selection
            glob:
              - "**/ROOT"
              - "**/ROOTS"
              - "src/**/*.thy"
              - "scripts/mk/pdf.sh"
              - "tests/test_pdf_session.py"
            run: pixi run isabelle-pdf-selection-check

          # Guard the generated Isabelle grammar's source-position/markup
          # contract independently of the generated-file drift check.
          - name: grammar-id-position
            glob:
              - "manifests/vimp-grammar.yaml"
              - "scripts/gen_vimp_isabelle.py"
              - "tests/test_gen_isabelle_id_position.py"
            run: pixi run grammar-id-position-check

          # The manifest controls supported analysis configurations; make sure
          # the handwritten support policy still agrees with it.
          - name: analysis-registry
            glob:
              - "manifests/analyses.yaml"
              - "tests/test_analysis_registry.py"
              - "src/Analyses/**/*.thy"
              - "cli/**/*.ml"
            run: pixi run analysis-registry-check

          # ----------------------------------------------------------------
          # Thesis: cheap source-level freshness checks
          # ----------------------------------------------------------------

          # A rename in the theories can leave the thesis naming something
          # that no longer exists. Either side can break the pairing.
          - name: thesis-refs
            glob:
              - "thesis/**/*.typ"
              - "src/**/*.thy"
            run: pixi run thesis-refs

          # Isabelle declarations shown in the thesis are extracted by name.
          # Reject commits where the checked-in snippets are stale.
          - name: thesis-snippets
            glob:
              - "thesis/shared/snippets.toml"
              - "thesis/shared/generated/snippets/*.thy"
              - "src/**/*.thy"
            run: pixi run thesis-snippets

          # Link-map consistency can be checked opportunistically against
          # locally available generated documentation. The lenient task is
          # intentionally used here because pre-commit does not build HTML.
          - name: thesis-links
            glob:
              - "thesis/**/*.typ"
              - "thesis/**/*.toml"
              - "src/**/*.thy"
              - "scripts/check_thesis_links.py"
            run: pixi run thesis-links

          # Site pages: every internal link and same-page anchor resolves to a
          # source file. Needs no site build; theory anchors only warn, as the
          # rendered theories are checked against the deployed site on main.
          - name: pages-links
            glob:
              - "pages/**"
              - "docs/images/**"
              - "scripts/check_pages_links.py"
              - "scripts/mk/pages-site.sh"
            run: pixi run pages-links

          # ----------------------------------------------------------------
          # Generated OCaml interface
          # ----------------------------------------------------------------

          # Fires on every staged .thy, not just on the generated .ml: the
          # check also reports theories changed since export regeneration.
          - name: codegen-module-map
            glob:
              - "codegen/generated/ml/Voblint_CLI.ml"
              - "src/**/*.thy"
            run: pixi run codegen-modules-check

          # The export root list decides what handwritten OCaml may name.
          - name: codegen-api-check
            glob:
              - "codegen/generated/ml/Voblint_CLI.ml"
              - "src/Executable_Surface/Codegen/Export/Voblint_Codegen.thy"
              - "cli/*.ml"
              - "cli/*.mly"
              - "codegen/regression/ocaml/*.ml"
              - "tests/property/*.ml"
            run: pixi run codegen-api-check

          # ----------------------------------------------------------------
          # Isabelle source/API invariants
          # ----------------------------------------------------------------

          - name: theory-prose-check
            glob: "src/**/*.thy"
            run: pixi run theory-prose-check

          - name: retired-identifiers-check
            glob:
              - "src/**/*.thy"
              - "scripts/retired_identifiers.txt"
            run: pixi run retired-identifiers-check

          # Whether a locale name is free depends on the complete theory tree.
          - name: locale-parameters-check
            glob: "src/**/*.thy"
            run: pixi run locale-parameters-check


# --------------------------------------------------------------------------
# Expensive freshness checks
#
# These are deliberately pre-push rather than pre-commit:
#
# - thesis-claims builds/uses the CLI and compares analyzer-derived figures.
# - thesis-facts queries a built Isabelle session.
# - thesis-typst rebuilds the thesis PDF and treats warnings as errors.
#
# Running them here catches stale thesis material before it reaches CI without
# turning every small commit into a full build.
# --------------------------------------------------------------------------
pre-push:
  jobs:
    - name: thesis-current
      group:
        parallel: true
        jobs:
          - name: thesis-analyzer-claims
            run: pixi run thesis-claims

          - name: thesis-theorem-facts
            run: pixi run thesis-facts

          - name: thesis-build
            run: pixi run thesis-typst