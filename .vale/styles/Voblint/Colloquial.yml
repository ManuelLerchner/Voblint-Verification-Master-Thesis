# thesis/CLAUDE.md "Review patterns": use the field's vocabulary.
extends: substitution
message: "Colloquial '%s': prefer '%s'."
level: warning
ignorecase: true
swap:
  says more: is more precise
  superset of states: over-approximation
  a lot of: many
  lots of: many
  a bunch of: several
  pretty much: almost
  figure out: determine
  get rid of: remove
