# thesis/CLAUDE.md "Review patterns": put the citation at the end of the claim
# instead of making the authors the subject.
extends: existence
message: "Citation as subject ('%s'): state the claim and cite at its end."
level: suggestion
nonword: true
tokens:
  - 'et al\.\s+(?!and\b|in\b|for\b|on\b|at\b|to\b|of\b|with\b)[a-z]+'
