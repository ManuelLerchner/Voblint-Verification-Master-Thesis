# `pixi run python-format-check` and `pixi run python-lint` gate these settings.
# Explicit paths from the pre-commit hook still honor `extend-exclude` via
# `force-exclude`.
target-version = "py310"
force-exclude = true
extend-exclude = ["codegen/generated", "vendor"]

[lint]
# `select` rather than `extend-select`, so a contributor's global ruff config
# cannot change what the project gate enforces.
select = ["E4", "E7", "E9", "F", "B", "I"]

[format]
# Listings the thesis prints verbatim keep their hand layout (aligned comments).
exclude = ["thesis/shared/code/*.py"]
