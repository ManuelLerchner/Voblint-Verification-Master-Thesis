[workspace]
name = "voblint"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

# Repository orchestration (pixi task list) plus the Python-side tooling
# each task actually needs, split by real dependency boundary below -- not
# by task grouping. The OCaml toolchain stays on opam:
# conda-forge's ocaml-findlib and ocaml-zarith have no osx-arm64 build, so
# pixi cannot be the sole toolchain manager for those on Apple Silicon.
# Tasks that call into them (codegen-regression, cli-build, property-build, ...)
# are plain shell/OCaml invocations that rely on those tools already being
# on PATH, not on a pixi-managed OCaml environment.

[dependencies]
python = ">=3.10"

# I/R: autocorrode's headless REPL MCP server (scripts/start-ir.sh). Not a
# lint/test/grammar concern -- its own dependency pair, needed by every
# environment a contributor would actually install, so it stays composed
# into default rather than requiring a separate opt-in.
[feature.ir.dependencies]
prompt_toolkit = ">=3.0"
mcp = ">=1.0"

# grammar/vimp.yaml -> scripts/gen_vimp_isabelle.py / gen_vimp_menhir.py
# (see AGENTS.md's "VIMP grammar pipeline"). Only these two generators need
# PyYAML; nothing else in the repo parses YAML.
[feature.grammar.dependencies]
pyyaml = "*"

[feature.grammar.tasks]
gen-grammar-isabelle = "python3 scripts/gen_vimp_isabelle.py"
gen-grammar-menhir = "python3 scripts/gen_vimp_menhir.py"
grammar-check-isabelle = "python3 scripts/gen_vimp_isabelle.py && bash scripts/mk/check-clean.sh src/VIMP/VIMP_Grammar_Generated.thy"
grammar-check-menhir = "python3 scripts/gen_vimp_menhir.py && bash scripts/mk/check-clean.sh cli/vimp_parser.mly cli/vimp_lexer.mll"
grammar-check = { depends-on = ["grammar-check-isabelle", "grammar-check-menhir"] }

# Hypothesis property-test suite (tests/property/).
[feature.test.dependencies]
hypothesis = ">=6.100"
pytest = ">=8.0"

[feature.test.tasks]
property-build = "bash scripts/mk/property-build.sh"
property = { cmd = "python3 -m pytest tests/property", depends-on = ["property-build"] }

# HTML result viewer (`voblint --html`). graphviz supplies `dot`, which
# renders the CFG the viewer's graph pane loads; the frontend itself is the
# vendor/g2html submodule, initialized by the report task rather than by
# vendor.sh so build/codegen never fetch it.
[feature.report.dependencies]
graphviz = "*"

[feature.report.tasks]
report = { cmd = "bash scripts/mk/report.sh", depends-on = ["cli-build"] }
# Pins the emitted directory's shape, which is a contract with a frontend this
# repository does not own -- see the test module's own docstring.
html-report-check = { cmd = "python3 -m pytest tests/test_html_report.py", depends-on = ["cli-build"] }
# Sweeps the whole fixture corpus, each under its own PARAM line, for the
# faults that only show up on particular programs -- see the script's docstring.
html-report-audit = { cmd = "python3 scripts/audit_html_reports.py", depends-on = ["cli-build"] }
# Sweeps the domain/solver/context space rather than the corpus: a
# configuration the legality table accepts must have a surface behind it.
html-config-audit = { cmd = "python3 scripts/audit_html_reports.py --combinations", depends-on = ["cli-build"] }

# Benchmarking (`pixi run bench`). hyperfine times cli/voblint once per
# abstract domain over the same fixture so domain/solver cost can be
# compared in place -- see scripts/mk/bench.sh's header for the sweep and
# probe behavior. matplotlib backs the --plot whisker-plot rendering
# (scripts/plot_bench.py): hyperfine only exports JSON, plotting is its
# documented companion-script pattern. >=3.10 for boxplot's
# tick_labels/orientation parameters.
[feature.bench.dependencies]
hyperfine = "*"
matplotlib-base = ">=3.10"

[feature.bench.tasks]
bench = { cmd = "bash scripts/mk/bench.sh", depends-on = ["cli-build"] }

# Git hooks (.lefthook.yaml).
[feature.lint.dependencies]
lefthook = "*"

[feature.lint.tasks]
lefthook-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[environments]
default = ["ir", "grammar", "test", "lint", "report", "bench"]
lint = ["lint"]
test = ["test"]
grammar = ["grammar"]
report = ["report"]
bench = ["bench"]

# --------------------------------------------------------------------------
# Repository task graph. Tasks here need only python3/bash/git (top-level
# `dependencies`, present in every environment) plus Isabelle/OCaml
# already on PATH -- no feature-specific package, so they stay common
# rather than living under any one feature. Nontrivial shell (Isabelle
# build invocations, submodule vendoring, OCaml link steps) lives in
# small versioned scripts under scripts/mk/ that these tasks call.
# ISABELLE/AFP/SESSION honor the same env-var overrides the old Makefile's
# `?=` defaults did, e.g. `AFP=/path/to/afp/thys pixi run build`.
# --------------------------------------------------------------------------

[tasks]
# Vendoring. Rarer maintenance actions (bumping vendor/autocorrode to
# upstream main) are plain git commands, not tasks -- see "Vendoring the TD
# solver" in README.md.
vendor = "bash scripts/mk/vendor.sh"

# Isabelle build
bootstrap = { cmd = "bash scripts/mk/bootstrap.sh", depends-on = ["vendor"] }
build = { cmd = "bash scripts/mk/build.sh", depends-on = ["vendor"] }
html = { cmd = "bash scripts/mk/html.sh", depends-on = ["vendor"] }
isabelle-lint = { cmd = "bash scripts/mk/isabelle-lint.sh", depends-on = ["vendor"] }
jedit = { cmd = "bash scripts/mk/jedit.sh", depends-on = ["vendor"] }

# Codegen (Isabelle export_code -> codegen/generated/)
codegen = { cmd = "bash scripts/mk/codegen.sh", depends-on = ["vendor"] }
codegen-check = { cmd = "bash scripts/mk/check-clean.sh codegen/generated/", depends-on = ["codegen"] }
# Reads the checked-in export, so it needs no Isabelle and can run in the
# pre-commit hook alongside the ASCII and grammar-drift guards.
codegen-modules = "python3 scripts/check_codegen_modules.py"
codegen-regression = "bash scripts/mk/codegen-regression.sh"

# voblint CLI
cli-build = "bash scripts/mk/cli-build.sh"
cli-test = { cmd = "bash scripts/mk/cli-test-run.sh", depends-on = ["cli-build"] }
# CLI plumbing (exit codes, --help, argument errors) that isn't expressible
# as a .vimp fixture's verdict report -- see tests/cli_smoke.py's docstring.
cli-smoke = { cmd = "python3 tests/cli_smoke.py", depends-on = ["cli-build"] }
voblint = { cmd = "bash scripts/mk/voblint-run.sh", depends-on = ["cli-build"] }
# Static checks over tests/regression/ fixture source -- no CLI build, no
# OCaml, so this fails fast before cli-test's build cost. See tests/run.py's
# lint_case for what it enforces (mirrors AGENTS.md's "Regression discipline").
regression-lint = "python3 tests/run.py --lint"

# Documentation coverage over .thy headings and locales. Regenerable index +
# a lint; deliberately NOT in `ci` yet -- there is a standing backlog of
# undocumented headings, and gating on it today would just be a red build.
# Add it to `ci` once that backlog is cleared.
docs-lint = "python3 scripts/extract_definitions.py --lint"

# Prose in .thy comments cites constants and lemmas with plain \<open>name\<close>
# cartouches, which Isabelle does not resolve -- so a rename leaves the comment
# describing something that no longer exists. Gating: the backlog is cleared.
thy-prose-refs = "python3 scripts/check_thy_prose_refs.py"
docs-overview = "python3 scripts/extract_definitions.py --dump docs/generated/DEFINITIONS_OVERVIEW.md"

# Pins scripts/gen_vimp_isabelle.py's identifier id_position/markup shape
# (see the test module's own docstring). Deliberately outside tests/property/
# and property-build's CLI-build dependency: this only imports the generator
# and grammar/vimp.yaml directly, no CLI binary needed, so it stays as fast
# and fail-fast as regression-lint above.
id-position-check = "python3 -m pytest tests/test_gen_isabelle_id_position.py"

# Everything CI runs, under one name. Spans all four features (lint,
# grammar, test, and build's plain isabelle/ocaml calls), so this only
# resolves from an environment that composes all of them -- i.e. default.
ci = { depends-on = [
  "lint",
  "grammar-check",
  "thy-prose-refs",
  "build",
  "codegen-check",
  "regression-lint",
  "id-position-check",
  "cli-test",
  "cli-smoke",
  "html-report-check",
  "html-report-audit",
  "html-config-audit",
  "codegen-regression",
  "property",
] }
