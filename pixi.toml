[workspace]
name = "voblint"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

# Repository orchestration (pixi task list) plus the Python-side tooling
# each task actually needs, split by real dependency boundary below -- not
# by task grouping. The OCaml toolchain stays on opam:
# conda-forge's ocaml-findlib and ocaml-zarith have no osx-arm64 build, so
# pixi cannot be the sole toolchain manager for those on Apple Silicon.
# Tasks that call into them (codegen-regression, cli-build, property-test, ...)
# are plain shell/OCaml invocations that rely on those tools already being
# on PATH, not on a pixi-managed OCaml environment.

[dependencies]
python = ">=3.10"
binaryen = ">=119"

# I/R: AutoCorrode's headless REPL MCP server (scripts/start-ir.sh). Not a
# lint/test/grammar concern -- its own dependency pair, needed by every
# environment a contributor would actually install, so it stays composed
# into default rather than requiring a separate opt-in.
[feature.ir.dependencies]
prompt_toolkit = ">=3.0"
mcp = ">=1.0"

# manifests/vimp-grammar.yaml -> scripts/gen_vimp_isabelle.py / gen_vimp_menhir.py
# (see AGENTS.md's "VIMP grammar pipeline"), and manifests/analyses.yaml ->
# scripts/gen_analysis_assembly.py. These three generators are the only
# things in the repo that parse YAML.
[feature.grammar.dependencies]
pyyaml = "*"
[feature.grammar.tasks]
grammar-isabelle-generate = { cmd = "python3 scripts/gen_vimp_isabelle.py", description = "Regenerate Isabelle syntax from manifests/vimp-grammar.yaml." }
grammar-menhir-generate = { cmd = "python3 scripts/gen_vimp_menhir.py", description = "Regenerate the Menhir and ocamllex frontends from manifests/vimp-grammar.yaml." }
grammar-isabelle-check = { cmd = "python3 scripts/gen_vimp_isabelle.py && bash scripts/mk/check-clean.sh src/Program_Model/VIMP/VIMP_Grammar_Generated.thy", description = "Regenerate the Isabelle grammar and fail if the tracked theory changes." }
grammar-menhir-check = { cmd = "python3 scripts/gen_vimp_menhir.py && bash scripts/mk/check-clean.sh cli/frontend/vimp_parser.mly cli/frontend/vimp_lexer.mll", description = "Regenerate the Menhir frontend and fail if tracked parser files change." }
grammar-printer-generate = { cmd = "python3 scripts/gen_vimp_printer.py", description = "Regenerate the OCaml VIMP source printer from manifests/vimp-grammar.yaml." }
grammar-printer-check = { cmd = "python3 scripts/gen_vimp_printer.py && bash scripts/mk/check-clean.sh cli/frontend/vimp_printer.ml", description = "Regenerate the OCaml VIMP printer and fail if the tracked printer changes." }
grammar-check = { depends-on = [
  "grammar-isabelle-check",
  "grammar-menhir-check",
  "grammar-printer-check",
], description = "Check every generated VIMP frontend and printer for drift." }

# manifests/analyses.yaml -> src/Analyses/<Domain>/generated/<Domain>_Analyses.thy.
# Registration only: the generated interpretations cite handwritten lemmas, which
# Isabelle still checks. `--check` diffs regenerated output against the checked-in
# theories itself, so the drift gate needs neither git nor a toolchain.
assembly-generate = { cmd = "python3 scripts/gen_analysis_assembly.py", description = "Regenerate analysis assembly theories from manifests/analyses.yaml." }
assembly-check = { cmd = "python3 scripts/gen_analysis_assembly.py --check", description = "Check generated analysis assembly theories against manifests/analyses.yaml." }

# Hypothesis property-test suite (tests/property/).
[feature.test.dependencies]
hypothesis = ">=6.100"
pytest = ">=8.0"
[feature.test.tasks]
# Hand-written support expectations checked against generated output, so a
# manifest edit that changes what the CLI offers has to be intended.
analysis-registry-check = { cmd = "python3 -m pytest tests/test_analysis_registry.py", description = "Check generated dispatcher support against the hand-written analysis policy." }
pages-scripts-check = { cmd = "python3 -m pytest tests/test_vimp_fixture.py tests/test_playground_link.py", description = "Check the fixture header reader, the playground example corpus, and playground link encoding and validation." }
property-test = { cmd = "python3 -m pytest tests/property", description = "Build the test drivers and run parser, printer, and AST property tests." }
arithmetic-diagnostics-check = { cmd = "python3 -m pytest tests/test_regression_arithmetic.py tests/test_arithmetic_diagnostics.py", depends-on = [
  "cli-build",
], description = "Check arithmetic warnings, source annotations, and HTML findings." }

# HTML result viewer (`voblint --html`). graphviz supplies `dot`, which
# renders the CFG the viewer's graph pane loads; the frontend itself is the
# vendor/g2html submodule, needed when generating a report.
[feature.report.dependencies]
graphviz = "*"
[feature.report.tasks]
html-report-serve = { cmd = "bash scripts/mk/report.sh", description = "Serve an existing HTML analysis report and open it in a browser." }
# Pins the emitted directory's shape, which is a contract with a frontend this
# repository does not own -- see the test module's own docstring.
html-report-structure-check = { cmd = "python3 -m pytest tests/test_html_report.py tests/test_value_rendering.py", depends-on = [
  "cli-build",
], description = "Check the emitted report structure consumed by the g2html frontend, and how abstract values read in every rendering." }
# Sweeps the whole fixture corpus, each under its own PARAM line, for the
# faults that only show up on particular programs -- see the script's docstring.
html-report-corpus-audit = { cmd = "python3 scripts/audit_html_reports.py", depends-on = [
  "cli-build",
], description = "Generate reports for the regression corpus and check cross-file invariants." }
# Sweeps the domain/solver/context space rather than the corpus: a
# configuration the legality table accepts must have a surface behind it.
html-report-config-audit = { cmd = "python3 scripts/audit_html_reports.py --combinations", depends-on = [
  "cli-build",
], description = "Check report generation across supported domain, solver, and context combinations." }

# Benchmarking (`pixi run voblint-bench`). hyperfine times cli/voblint once per
# abstract domain over the same fixture so domain/solver cost can be
# compared in place -- see scripts/mk/bench.sh's header for the sweep and
# probe behavior. matplotlib backs the --plot whisker-plot rendering
# (scripts/plot_bench.py): hyperfine only exports JSON, plotting is its
# documented companion-script pattern. >=3.10 for boxplot's
# tick_labels/orientation parameters.
[feature.bench.dependencies]
hyperfine = "*"
matplotlib-base = ">=3.10"
[feature.bench.tasks]
voblint-bench = { cmd = "bash scripts/mk/bench.sh", depends-on = [
  "cli-build",
], description = "Benchmark selected abstract domains over one VIMP program." }

# Git hooks (.lefthook.yaml) and the formatters and linters they gate on.
# Each tool's own config file excludes generated and vendored sources.
[feature.lint.dependencies]
lefthook = "*"
ruff = ">=0.16"
shellcheck = ">=0.11"
actionlint = ">=1.7"
zizmor = ">=1.30"
typstyle = ">=0.15"
biome = ">=2.5"
markdownlint-cli2 = ">=0.23"
typos = ">=1.50"
taplo = ">=0.10"
[feature.lint.tasks]
python-format = { cmd = "ruff format", description = "Format tracked Python sources with ruff." }
python-format-check = { cmd = "ruff format --check", description = "Check that Python sources are formatted with ruff." }
python-lint = { cmd = "ruff check", description = "Lint Python sources with ruff." }
# Workflow run blocks are shell too: actionlint checks them with shellcheck.
# `files` defaults to every tracked script; the pre-commit hook passes its staged ones.
shell-lint = { cmd = "bash scripts/mk/shell-lint.sh", description = "Lint tracked shell scripts, or the given ones, with shellcheck." }
actions-lint = { cmd = "actionlint && zizmor --offline .github", description = "Lint GitHub workflows with actionlint and audit them with zizmor." }
# 100 columns, the line limit the theories follow. The symbol table is generated.
typst-format = { cmd = "bash scripts/mk/typst-format.sh", description = "Format thesis Typst sources, or the given ones, with typstyle." }
typst-format-check = { cmd = "typstyle -l 100 --check $(git ls-files '*.typ' ':!thesis/lib/isabelle-symbols.typ')", description = "Check that thesis Typst sources are formatted with typstyle." }
markdown-lint = { cmd = "markdownlint-cli2", description = "Lint Markdown documentation with markdownlint-cli2." }
spelling-check = { cmd = "typos", description = "Check source and prose spelling with typos." }
toml-format = { cmd = "taplo fmt", description = "Format TOML files with taplo." }
toml-format-check = { cmd = "taplo fmt --check", description = "Check that TOML files are formatted with taplo." }
pages-format = { cmd = "biome check --write", description = "Format the site's JavaScript and CSS and apply safe biome lint fixes." }
pages-lint = { cmd = "biome ci", description = "Check the site's JavaScript and CSS formatting and lint with biome." }
hooks-install = { cmd = "lefthook install", description = "Install the repository's Lefthook Git hooks." }
# Over every file, `stage_fixed` would stage unrelated worktree edits.
pre-commit = { cmd = "lefthook run pre-commit --all-files --no-stage-fixed", description = "Run every pre-commit hook against the full repository." }
[environments]
default = ["ir", "grammar", "test", "lint", "report", "bench", "thesis"]
thesis = ["thesis"]
lint = ["lint"]
test = ["test"]
grammar = ["grammar"]
report = ["report"]
bench = ["bench"]

# --------------------------------------------------------------------------
# Repository task graph. Tasks here need only python3/bash/git (top-level
# `dependencies`, present in every environment) plus Isabelle/OCaml
# already on PATH -- no feature-specific package, so they stay common
# rather than living under any one feature. Nontrivial shell (Isabelle
# build invocations, submodule vendoring, OCaml link steps) lives in
# small versioned scripts under scripts/mk/ that these tasks call.
# ISABELLE/AFP/SESSION are honored as env-var overrides, e.g.
# `AFP=/path/to/afp/thys pixi run isabelle-build`.
# --------------------------------------------------------------------------
[tasks]
# OCaml packages remain in opam because conda-forge does not provide the full
# toolchain on every supported platform. Pixi is the shared installation
# interface; voblint.opam is the dependency source of truth.
ocaml-deps-install = { cmd = "opam install . --deps-only --with-test", description = "Install the OCaml build and test dependencies declared in voblint.opam." }

# Vendoring. AutoCorrode is optional developer tooling installed into the
# ignored vendor/autocorrode/ directory, outside the repository's submodule set.
vendor-init = { cmd = "bash scripts/mk/vendor.sh", description = "Initialize the pinned td-verification submodule when absent." }

# Isabelle build
isabelle-bootstrap = { cmd = "bash scripts/mk/bootstrap.sh", depends-on = [
  "vendor-init",
], description = "Build foundational Isabelle sessions in topological order on a fresh checkout." }
isabelle-build = { cmd = "bash scripts/mk/build.sh", depends-on = [
  "vendor-init",
], description = "Build Voblint_Examples and its complete Isabelle dependency closure." }
isabelle-html-build = { cmd = "bash scripts/mk/html.sh", depends-on = [
  "vendor-init",
], description = "Clean-build Isabelle browser documentation for every session into build/isabelle-html/." }
pages-site-build = { cmd = "bash scripts/mk/pages-site.sh", depends-on = [
  "vendor-init",
  "browser-build",
], description = "Assemble the GitHub Pages site from rendered HTML, PDFs, and the browser analyzer." }
pages-site-serve = { cmd = "python3 -m http.server --directory build/github-pages 8000", description = "Serve the assembled Pages site at http://localhost:8000; the playground's module scripts do not load from file://." }
isabelle-pdf-build = { cmd = "bash scripts/mk/pdf.sh", depends-on = [
  "vendor-init",
], description = "Render the formalization with a certificate appendix into output/document.pdf." }
isabelle-pdf-full-build = { cmd = "bash scripts/mk/pdf.sh --include-examples", depends-on = [
  "vendor-init",
], description = "Render all theories and example sessions into output/document-full.pdf." }
isabelle-pdf-selection-check = { cmd = "python3 tests/test_pdf_session.py", description = "Check PDF theory selection, certificate inclusion, and preserved proof imports." }
# Outside `verify` and outside CI, on purpose: the community linter has never
# reported a finding on this tree, and it installs itself from the linter's
# master branch, so what it checks is not pinned to anything here. Run it by
# hand when the style rules are the question.
isabelle-lint = { cmd = "bash scripts/mk/isabelle-lint.sh", depends-on = [
  "vendor-init",
], description = "Run the Isabelle community linter over all project sessions; manual, not part of verify or CI." }
isabelle-jedit = { cmd = "bash scripts/mk/jedit.sh", depends-on = [
  "vendor-init",
], description = "Launch Isabelle/jEdit with the AFP, solver, and project session roots." }

# Codegen (Isabelle export_code -> codegen/generated/)
codegen = { cmd = "bash scripts/mk/codegen.sh", depends-on = [
  "vendor-init",
], description = "Regenerate the checked-in OCaml export from Voblint_Codegen." }
codegen-check = { cmd = "bash scripts/mk/check-clean.sh codegen/generated/", depends-on = [
  "codegen",
], description = "Regenerate the OCaml export and fail if the tracked output changes." }
# Reads the checked-in export, so it needs no Isabelle and can run in the
# pre-commit hook alongside the ASCII and grammar-drift guards.
codegen-modules-check = { cmd = "python3 scripts/check_codegen_modules.py", description = "Check that the OCaml export contains exactly the expected generated modules." }
# A slashed theory entry in a ROOT fails the whole session at load, so jEdit
# will not start and the mistake presents as a dead editor rather than as an
# error in the file that caused it. Needs no Isabelle.
sessions-check = { cmd = "python3 scripts/check_root_entries.py", description = "Check session ROOT entries, search paths, and owned-theory reachability." }
reelaboration-check = { cmd = "python3 scripts/check_build_reelaboration.py", description = "Report what a build log re-elaborated; fail if a library session exceeds its budget. Takes a `isabelle build -v` log." }
# Everything the export exposes is decided by its root list, and a missing
# root breaks an OCaml consumer rather than the Isabelle build. Reads the
# checked-in export too, so it costs a second and needs no toolchain.
codegen-api-check = { cmd = "python3 scripts/check_generated_api.py", description = "Check handwritten OCaml consumers against the generated public export surface." }
codegen-regression = { cmd = "bash scripts/mk/codegen-regression.sh", description = "Compile and run the OCaml regression driver against the checked-in export." }

# OCaml formatting. ocamlformat comes from opam like the rest of the toolchain,
# pinned in .ocamlformat; .ocamlformat-ignore excludes generated sources.
ocaml-format = { cmd = "bash scripts/mk/ocaml-format.sh", description = "Format handwritten OCaml sources and dune files." }
ocaml-format-check = { cmd = "bash scripts/mk/ocaml-format.sh --check", description = "Check that handwritten OCaml sources and dune files are formatted." }
opam-lint = { cmd = "opam lint voblint.opam", description = "Lint the opam package manifest." }
format = { depends-on = [
  "python-format",
  "ocaml-format",
  "typst-format",
  "toml-format",
  "pages-format",
], description = "Format Python, OCaml, dune, Typst, TOML, and site JavaScript and CSS sources." }

# voblint CLI
cli-build = { cmd = "bash scripts/mk/cli-build.sh", description = "Build the voblint CLI from the checked-in generated OCaml and frontend sources." }
browser-build = { cmd = "bash scripts/mk/browser-build.sh", description = "Compile the generated analyzer and browser adapter to WebAssembly." }
cli-test = { cmd = "bash scripts/mk/cli-test-run.sh", description = "Build the CLI and run the external VIMP regression corpus." }
# CLI plumbing (exit codes, --help, argument errors) that isn't expressible
# as a .vimp fixture's verdict report -- see tests/cli_smoke.py's docstring.
cli-smoke = { cmd = "python3 tests/cli_smoke.py", description = "Build the CLI and test help, errors, exit codes, and output plumbing." }
voblint = { cmd = "bash scripts/mk/voblint-run.sh", depends-on = [
  "cli-build",
], description = "Build and run the Voblint analyzer, with an optional interactive fixture picker." }
# Static checks over tests/regression/ fixture source -- no CLI build, no
# OCaml, so this fails fast before cli-test's build cost. See tests/run.py's
# lint_case for what it enforces (mirrors AGENTS.md's "Regression discipline").
regression-lint = { cmd = "python3 tests/run.py --lint", description = "Check regression fixture placement, headers, expectations, and metadata." }

# Documentation coverage over .thy headings and locales. Regenerable index +
# a lint; deliberately not in `verify` yet -- there is a standing backlog of
# undocumented headings, and gating on it today would just be a red build.
# Add it to `verify` once that backlog is cleared.
docs-coverage-check = { cmd = "python3 scripts/extract_definitions.py --lint", description = "Check documentation coverage for Isabelle theories, headings, and locales." }

# Prose in .thy comments cites constants and lemmas with plain \<open>name\<close>
# cartouches, which Isabelle does not resolve -- so a rename leaves the comment
# describing something that no longer exists. Gating: the backlog is cleared.
theory-prose-check = { cmd = "python3 scripts/check_thy_prose_refs.py", description = "Check that identifiers cited in Isabelle prose still exist." }

# An identifier removed together with its theory stays legal inside `assumes`,
# where Isabelle reads it as a free variable -- so a locale keeps building with
# an assumption that has quietly stopped constraining anything. Only an
# explicit list of retired names catches that; scripts/retired_identifiers.txt
# holds it.
retired-identifiers-check = { cmd = "python3 scripts/check_retired_identifiers.py", description = "Check that deliberately retired Isabelle identifiers remain absent." }

# The general form of the same failure: any identifier left free in a locale
# assumption, whether or not it was ever a constant here. Isabelle generalizes
# the assumption over it, so the locale keeps building while the assumption
# stops saying anything.
locale-parameters-check = { cmd = "python3 scripts/check_locale_parameters.py", description = "Check locale assumptions for accidentally free identifiers." }

docs-overview-generate = { cmd = "python3 scripts/extract_definitions.py --dump --out docs/generated/DEFINITIONS_OVERVIEW.md", description = "Regenerate the local Isabelle definitions and theorem overview." }

# Size and shape of the .thy corpus: lines per session, per theory, and per
# proof, plus a watchlist of theories past the 1500-line / 100-symbol style
# limits. Reporting only -- never gates a build, so it stays out of `verify`.
# Views and formats: `pixi run theory-stats -- --help`.
theory-stats = { cmd = "python3 scripts/thy_stats.py", description = "Report theory, session, proof, and line-length statistics." }

# Pins scripts/gen_vimp_isabelle.py's identifier id_position/markup shape
# (see the test module's own docstring). Deliberately outside tests/property/
# and property-test's binary builds: this only imports the generator
# and manifests/vimp-grammar.yaml directly, no CLI binary needed, so it stays as fast
# and fail-fast as regression-lint above.
grammar-id-position-check = { cmd = "python3 -m pytest tests/test_gen_isabelle_id_position.py", description = "Check Isabelle grammar identifier position and markup generation." }

# Fast repository checks used directly by hooks and CI.
isabelle-ascii-check = { cmd = "python3 scripts/check_isabelle_ascii.py", description = "Check Isabelle theory sources for forbidden Unicode syntax." }
verification-surface-check = { cmd = "python3 scripts/check_verification_surface.py", description = "Check task descriptions, retired task names, and verify/GitHub CI parity." }

# Supported local verification gate. GitHub CI invokes the same named leaf
# tasks in separately scheduled jobs; verification-surface-check prevents drift.
# This only resolves from the default environment, which composes every feature.
# Keep it deliberately fail-fast:
#
#   1. pure/static repository checks
#   2. cheap generated/frontend/CLI checks
#   3. analyzer/report integration checks
#   4. Isabelle-dependent work
#   5. documentation/PDF builds
#
# Pixi executes `depends-on` entries in the order listed and stops at the
# first failure, so ordering here directly controls how quickly `verify`
# reports inexpensive mistakes.
verify = { depends-on = [
  # ------------------------------------------------------------------------
  # Static / no-build checks
  # ------------------------------------------------------------------------
  "verification-surface-check",
  "python-format-check",
  "python-lint",
  "ocaml-format-check",
  "opam-lint",
  "shell-lint",
  "actions-lint",
  "typst-format-check",
  "markdown-lint",
  "spelling-check",
  "toml-format-check",
  "pages-lint",
  "pages-links",
  "theory-anchors-check",
  "pages-scripts-check",
  "regression-lint",
  "isabelle-ascii-check",
  "sessions-check",
  "grammar-id-position-check",
  "grammar-check",
  "assembly-check",
  "analysis-registry-check",
  "codegen-modules-check",
  "codegen-api-check",
  "isabelle-pdf-selection-check",
  "theory-prose-check",
  "retired-identifiers-check",
  "locale-parameters-check",
  "thesis-refs",
  "thesis-snippets",

  # ------------------------------------------------------------------------
  # Cheap standalone builds / generated-code consumers
  # ------------------------------------------------------------------------
  "thesis-typst",
  "codegen-regression",

  # ------------------------------------------------------------------------
  # CLI / analyzer / report checks
  # ------------------------------------------------------------------------
  "cli-smoke",
  "cli-test",
  "arithmetic-diagnostics-check",
  "property-test",
  "html-report-structure-check",
  "html-report-corpus-audit",
  "html-report-config-audit",
  "thesis-claims",

  # ------------------------------------------------------------------------
  # Isabelle-dependent checks
  #
  # Keep the main build before consumers such as thesis-facts/codegen so
  # they can reuse the populated heap store.
  # ------------------------------------------------------------------------
  "isabelle-build",
  "reelaboration-check",
  "thesis-facts",
  "codegen-check",

  # ------------------------------------------------------------------------
  # Expensive rendered artifacts
  # ------------------------------------------------------------------------
  "isabelle-html-build",
  "isabelle-pdf-build",
], description = "Run the supported local verification gate, cheapest fail-fast checks first; GitHub CI runs the same leaf checks separately." }
[feature.thesis.dependencies]
typst = ">=0.15"
[feature.thesis.tasks]
# The thesis names constants, lemmas, locales and types that live in the
# theories. `check_thesis_refs` resolves each one against the command that
# declares it, so a rename shows up as a build failure rather than as a
# sentence about something that no longer exists.
thesis-refs = { cmd = "python3 scripts/check_thesis_refs.py", description = "Check thesis entity references against Isabelle declarations and sessions." }

# Figures built from analyzer output are regenerated and diffed, so a thesis
# claim cannot outlive the behaviour it describes.
thesis-claims = { cmd = "python3 thesis/tools/claims.py --check", depends-on = [
  "cli-build",
], description = "Check thesis analyzer figures against current CLI output." }
thesis-claims-write = { cmd = "python3 thesis/tools/claims.py --write", depends-on = [
  "cli-build",
], description = "Regenerate thesis analyzer figures from current CLI output." }

# Declarations the thesis shows are lifted out of the theories by name, never
# retyped. Pure text extraction -- no Isabelle needed, so this runs fail-fast.
thesis-snippets = { cmd = "python3 thesis/tools/snippets.py --check", description = "Check thesis Isabelle snippets against their source declarations." }
thesis-snippets-write = { cmd = "python3 thesis/tools/snippets.py --write", description = "Regenerate thesis Isabelle snippets from their source declarations." }

# Theorem statements are exported from a built session, which is what gives the
# Typst template the guarantee LaTeX gets from Isabelle's @{thm} antiquotation.
# Needs the session in facts.toml to be built.
thesis-facts = { cmd = "python3 thesis/tools/facts.py --check", description = "Check thesis theorem statements against a built Isabelle session." }
thesis-facts-write = { cmd = "python3 thesis/tools/facts.py --write", description = "Regenerate thesis theorem statements from a built Isabelle session." }

# Explanatory figures already drawn for the explainer page, lifted into thesis
# assets with the site palette rewritten. Reads pages/, never writes to it.
thesis-figures = { cmd = "python3 thesis/tools/explainer_svg.py --check", description = "Check extracted explainer figures against pages/index.html." }
thesis-figures-write = { cmd = "python3 thesis/tools/explainer_svg.py", description = "Re-extract explainer figures into thesis assets." }

# Warnings are failures; an unresolved reference must not scroll past unread.
thesis-typst = { cmd = "bash thesis/tools/typst-build.sh", description = "Build the thesis PDF and fail on warnings." }

# Same build, but warnings do not stop it -- for drafting.
thesis-draft = { cmd = "bash thesis/tools/typst-build.sh --allow-warnings", description = "Build the thesis PDF while allowing warnings during drafting." }

# Live rebuild while writing.
thesis-watch = { cmd = "typst watch --root thesis --font-path thesis/assets/fonts thesis/thesis.typ thesis/Voblint_Thesis.pdf", description = "Watch thesis sources and rebuild the PDF." }

# Isabelle's symbol table, turned into the lookup the template decodes with.
thesis-symbols = { cmd = "python3 thesis/tools/gen_isabelle_symbols.py > thesis/lib/isabelle-symbols.typ", description = "Generate the Isabelle symbol table used by the thesis." }

# Everything the thesis quotes from the formalization or the analyzer.
thesis-generated = { depends-on = [
  "thesis-snippets-write",
  "thesis-claims-write",
  "thesis-facts-write",
  "thesis-figures-write",
], description = "Regenerate all thesis artifacts from the current sources and build outputs." }

# Every drift check, in one name.
thesis-check = { depends-on = [
  "thesis-refs",
  "thesis-snippets",
  "thesis-figures",
  "thesis-claims",
  "thesis-facts",
  "thesis-typst",
  "thesis-links",
], description = "Run all thesis drift and theorem checks." }

# Entity citations link to their definition in the rendered theories, anchor by
# anchor. Locally this is advisory: a working copy rarely has a current
# build/isabelle-html, and a link cannot be validated before the theories are built.
thesis-links = { cmd = "python3 scripts/check_thesis_links.py --check --lenient", description = "Check thesis entity links against available generated HTML." }
thesis-links-strict = { cmd = "python3 scripts/check_thesis_links.py --check", description = "Strictly check thesis entity links against generated HTML." }
thesis-links-write = { cmd = "python3 scripts/check_thesis_links.py --write", description = "Regenerate the thesis entity link map from generated HTML." }

# The gate that matters, and the only one that can be honest: it runs against
# the deployed pages, so it cannot run until GitHub Pages has published them.
thesis-links-live = { cmd = "python3 scripts/check_thesis_links.py --live", description = "Check thesis links against the published documentation site." }
pages-links = { cmd = "python3 scripts/check_pages_links.py --sources", description = "Check the site pages' internal links against the repository, without building the site." }
theory-anchors-check = { cmd = "python3 scripts/check_theory_anchors.py", description = "Check site links' theory anchors against the theory sources, including locale qualification, without building the site." }
pages-site-links = { cmd = "python3 scripts/check_pages_links.py --site build/github-pages", description = "Check the site pages' internal links and theory anchors against the assembled site." }
pages-links-live = { cmd = "python3 scripts/check_pages_links.py --live", description = "Check every link the site pages carry, internal and external, against the published site." }
