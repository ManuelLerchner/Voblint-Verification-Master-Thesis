# The analysis registry.
#
# This file answers three questions and nothing else:
#
#   1. Which verified implementation is this domain?
#   2. Which solver and context registrations does it carry?
#   3. Which API capabilities does each published combination expose?
#
# How those choices become theories, bindings and proofs is
# the generator's decision, not a per-domain setting. Domain rationale -- why a
# lattice has finite height, why a solver choice matters here -- belongs in the
# domain's README, not in registration data.
#
# `legacy:` is the one exception, and it is deliberately quarantined: it maps
# the uniform interface onto spellings that predate it. Every entry there is a
# rename waiting to happen, not an extension point. Nothing outside `legacy:`
# names an existing identifier that a convention could have produced.

# `title` names the discipline in a table or a heading; `rule` names the update
# rule inside a sentence, where the hyphenated adjective form is what reads.
solvers:
  always_join:
    title: Always join
    rule: always-join
    interp: TD_side_always_join_Interp
  per_origin:
    title: Per origin
    rule: per-origin
    interp: TD_side_per_origin_Interp
  warrowing_apinis:
    title: Apinis warrowing
    rule: Apinis-warrowing
    interp: TD_side_warrowing_apinis_Interp
  warrowing_per_origin:
    title: Warrowing per origin
    rule: warrowing-per-origin
    interp: TD_side_warrowing_per_origin_Interp

domains:
  - name: Sign
    adopted: true
    value_type: sign
    tag: SignValue
    # Ordered. The first route is the production instance: it publishes the
    # full name set and the others are proved to solve its equation system.
    routes: [always_join, per_origin]
    # Which contextual registrations the theory layer carries.
    registrations:
      adopted: true
      entry_state: {solvers: [always_join], default: always_join}
      call_string: {solvers: [always_join], default: always_join}
    # The published runtime names. `ctx_prefix` and the surface binders are
    # spellings that predate any convention: `sign_join_surface` carries the
    # suffix because `sign_join` is already the unit assembly's binder, while
    # Interval's and Int's assembly binders are `_asm`-suffixed and left the
    # bare name free. Explainable, not derivable -- so recorded, not invented.
    checks:
      adopted: true
      ctx_prefix: sign_conf
      imports:
        - Sign_Classify
        - '"Voblint_Framework.Check_Report"'
        - '"Voblint_Result.Analysis_Surface"'
        - Sign_Analyses
      routes:
        always_join:
          surface: sign_join_surface
        per_origin:
          surface: sign_per_origin
          suffix: _per_origin
          # Sign publishes no `_for` hop for the sibling report, where Parity and
          # Congruence do. Read off the working file; no consumer depends on the
          # difference, so unifying it is a change to make deliberately.
          published: [sol, result_for, result, report]
    entry:
      adopted: true
      routes:
        always_join:
          endpoints: full
          terminates: sign_conf_terminates_prog
          sol: sign_conf_sol_prog
          cover: sign_conf_vars_cover_prog_of_exec
          closure: sign_closure
          result_for: analyse_sign_result_for
          report_for: analyse_sign_report_for
          result: analyse_sign_result
          report: analyse_sign_report
    legacy:
      impl_prefix: sign
      classifier: sign_classify_check
      init_gamma: sign_cinit_gamma
      extra_imports: ['"Voblint_VIMP.VIMP_Notation"']
      binders: {always_join: sign_join, per_origin: sign_po_asm}
      prefixes: {always_join: sign_unit, per_origin: sign_po}

  - name: Interval
    adopted: true
    value_type: ivl
    tag: IntervalValue
    routes: [warrowing_apinis, always_join, per_origin, warrowing_per_origin]
    # Which contextual registrations the theory layer carries.
    registrations:
      adopted: true
      # Interval is the one domain with hand-written content left to host the
      # registrations next to -- the presentation-routing block, which is not
      # derivable and must not be. So its generated theory is separate and
      # `Interval_Analyses` stays hand-written and imports it. The mechanism is
      # uniform across domains; only whether there is a hand-written host differs.
      theory: Interval_Contextual_Assembly
      # Interval's hand-written file survives, so what moves is decided name by
      # name. The entry-state published constants and the six `entry_state_*`
      # re-exports stay: `interval_es` is a `global_interpretation`, so its
      # binder is visible to an importing theory. The call-string re-exports
      # cannot -- `interval_cs` is a plain `interpretation` and does not export
      # outside its context -- so those two names travel with the registration
      # and are named here.
      #
      # The call-string `published:` list is the conventional three. What stays
      # hand-written there is `cs_call_string_eqs_prog` and
      # `cs_call_string_sol_prog`: the equation system and its raw solution,
      # which no other domain publishes and which an example pins solved values
      # against one unknown at a time. There is no shape for this file to name.
      # All four disciplines are registered on both contextual routes.
      #
      # ORDER IS SEMANTIC. The first solver listed owns the unsuffixed binder
      # and the route's public `defines` aliases, so it must stay the route's
      # `default`. Reordering these lists as a tidy-up silently rebinds
      # `interval_es` and every name defined from it to a different discipline,
      # and every citation keeps typechecking while meaning something else.
      entry_state:
        solvers: [warrowing_apinis, always_join, per_origin, warrowing_per_origin]
        default: warrowing_apinis
        published: []
        re_exports: {}
      call_string:
        solvers: [warrowing_apinis, always_join, per_origin, warrowing_per_origin]
        default: warrowing_apinis
        published: [result_for, result, report]
        re_exports:
          sound: analyse_interval_call_string_sound
          terminates_of_solve_c: cs_call_string_terminates_via_solve_c
          gamma_reader: analyse_interval_call_string_gamma_reader_eq_lookup
          vars_finite: analyse_interval_call_string_vars_finite
          sound_of_cover: analyse_interval_call_string_sound_of_cover
          sound_of_terminates: analyse_interval_call_string_sound_of_terminates
          union_of_cover: analyse_interval_call_string_ltr_collect_eq_Union
    # Interval's four disciplines all publish a solve and a report, so every
    # route names the constants it publishes rather than taking the production
    # or sibling default: a sibling here still publishes its own `terminates`
    # and the lemma that discharges it, which Sign's and Parity's do not.
    #
    # The two suffixes come apart here and nowhere else. The published API
    # leaves the production discipline unmarked, the way every other domain
    # does, so `analyse_interval_report` is the warrowing report. The solved
    # system still leaves always-join unmarked, so `interval_conf_sol_prog` is
    # the join solve while `interval_conf_eqs_prog` beside it is production's
    # system -- Interval's own inherited spelling, and not the one Int uses,
    # where `int_conf_sol_prog` is the production solve. Closing that gap swaps
    # two names that both stay live, so a consumer left behind would read the
    # other discipline in silence rather than fail; it belongs in its own
    # change, not in this one.
    checks:
      adopted: true
      ctx_prefix: interval_conf
      hide_consts: [phase.N]
      imports:
        - Interval_Assembly
        - '"Voblint_Framework.Check_Report"'
        - '"Voblint_Result.Analysis_Surface"'
      routes:
        warrowing_apinis:
          surface: interval_warrow
          suffix: ''
          solved_suffix: _warrow
        always_join:
          surface: interval_join
          suffix: _join
          solved_suffix: ''
          published: [sol, terminates, terminates_via_solve_c,
                      result_for, result, report_for, report]
        per_origin:
          surface: interval_per_origin
          suffix: _per_origin
          published: [sol, terminates, terminates_via_solve_c,
                      result_for, result, report_for, report]
        warrowing_per_origin:
          surface: interval_wpo
          suffix: _wpo
          published: [sol, terminates, terminates_via_solve_c,
                      result_for, result, report_for, report]
    # Three of the four routes publish endpoints, and only the production one
    # publishes them in full: `endpoints: reports` says a discipline publishes
    # the two check-report readings and stops there. The fourth,
    # warrowing per origin, publishes no endpoint at all.
    entry:
      adopted: true
      routes:
        warrowing_apinis:
          endpoints: full
          terminates: interval_conf_terminates_prog_warrow
          sol: interval_conf_sol_prog_warrow
          cover: interval_conf_vars_cover_prog_of_exec
          closure: interval_warrow_closure
          result_for: analyse_interval_result_for
          report_for: analyse_interval_report_for
          result: analyse_interval_result
          report: analyse_interval_report
        always_join:
          endpoints: reports
          terminates: interval_conf_terminates_prog
          sol: interval_conf_sol_prog
          closure: interval_join_closure
          result_for: analyse_interval_result_join_for
          report_for: analyse_interval_report_join_for
          report: analyse_interval_report_join
        per_origin:
          endpoints: reports
          terminates: interval_conf_terminates_prog_per_origin
          sol: interval_conf_sol_prog_per_origin
          closure: interval_po_closure
          result_for: analyse_interval_result_per_origin_for
          report_for: analyse_interval_report_per_origin_for
          report: analyse_interval_report_per_origin
    legacy:
      impl_prefix: ivl
      # Settled by cutting and looking. `Interval_Transfer` dropped;
      # `Routed_Context` added explicitly. `Interval_Assembly` is required not
      # by any constant but by a `\<^theory>` pin in a prose dependency claim
      # at Interval_Solver_Analyses:24 -- dropping it left this file clean at
      # 382/382 and broke its consumer.
      ctx_imports:
        - Interval_Sound
        - Interval_Assembly
        - Interval_Classify
        - '"Voblint_Result.Routed_Live_Keys"'
        - '"Voblint_Framework.Call_String_Context"'
        - '"Voblint_Framework.Routed_Context"'
        - '"Voblint_Solver.TD_Solver_Bridge"'
        - '"Voblint_VIMP.VIMP_Program"'
        - '"TD.TD_side_upd_rule"'
      # Interval's entry-state constants predate the published convention:
      # seven are spelled without the domain prefix, it publishes `reader`
      # which no other domain does, and `context_rel` precedes the three
      # `analyse_` names. Consumers and examples cite these, so the whole
      # ordered list is given rather than a rename map.
      ctx_defines:
        entry_state:
          - interval_entry_state_spec: analysis_spec
          - interval_entry_state_root_query: root_query
          - entry_state_eqs_prog: equations
          - entry_state_sol_prog: solution
          - entry_state_terminates_prog: terminates
          - entry_state_vars_prog: sol_vars
          - entry_state_env_prog: sol_env
          - entry_state_sg_st_prog: reader
          - entry_state_context_rel: admitted_contexts
          - analyse_interval_entry_state_result_for: result
          - analyse_interval_entry_state_report_for: verdict_report
          - analyse_interval_entry_state_projection_for: check_projection
      classifier: interval_classify_check
      init_gamma: interval_cinit_gamma
      binders:
        warrowing_apinis: interval_warrow_asm
        always_join: interval_join_asm
        per_origin: interval_po_asm
        warrowing_per_origin: interval_wpo_asm
      prefixes:
        warrowing_apinis: interval_td
        always_join: interval_join
        per_origin: interval_po
        warrowing_per_origin: interval_wpo

  - name: Parity
    adopted: true
    value_type: parity
    tag: ParityValue
    routes: [always_join, per_origin]
    # Which contextual registrations the theory layer carries.
    registrations:
      adopted: true
      entry_state: {solvers: [always_join], default: always_join}
      call_string: {solvers: [always_join], default: always_join}
    # The runtime API layer: one binder and prefix per discipline the check
    # report publishes. Every name here is a check-report layer spelling that
    # predates any convention, so the block reads as a map rather than as policy.
    checks:
      adopted: true
      ctx_prefix: parity_conf
      imports:
        - Parity_Assembly
        - '"Voblint_Framework.Check_Report"'
        - '"Voblint_Result.Analysis_Surface"'
      routes:
        always_join:
          surface: parity_join_surface
        per_origin:
          surface: parity_per_origin
          suffix: _per_origin
    # Endpoints are published for the production discipline only: the
    # per-origin instance is registered and reported, not given endpoints.
    entry:
      adopted: true
      hide_consts: [phase.N]
      routes:
        always_join:
          endpoints: full
          terminates: parity_conf_terminates_prog
          sol: parity_conf_sol_prog
          cover: parity_conf_vars_cover_prog_of_exec
          closure: parity_closure
          result_for: analyse_parity_result_for
          report_for: analyse_parity_report_for
          result: analyse_parity_result
          report: analyse_parity_report
    legacy:
      impl_prefix: parity
      # No `Parity_Assembly` here, unlike Sign's: `Parity_Checks` imports it
      # directly, where `Sign_Checks` reaches it only through `Sign_Analyses`.
      # Same rule, different consumer wiring -- the difference is correct.
      # `TD.TD_side_upd_rule` is named though no constant of its appears: the
      # solver obligations are discharged by locale-qualified facts, and a
      # locale-qualified fact does not name its defining theory.
      ctx_imports:
        - Parity_Sound
        - Parity_Classify
        - Parity_Transfer
        - Parity_Exec
        - '"Voblint_Result.Routed_Live_Keys"'
        - '"Voblint_Framework.Call_String_Context"'
        - '"Voblint_Framework.Routed_Context"'
        - '"Voblint_Solver.TD_Solver_Bridge"'
        - '"Voblint_VIMP.VIMP_Program"'
        - '"TD.TD_side_upd_rule"'
      classifier: parity_classify_check
      init_gamma: parity_cinit_gamma
      # Parity's own commutation theorem is unconditional, which is stronger
      # than the registration shape obligation 2 cites into and therefore not
      # citable there. The domain keeps the sharper theorem and owns this
      # corollary; registration names the corollary.
      facts:
        tf_commute: parity_tf_st_for_commute_if_live
      binders: {always_join: parity_join, per_origin: parity_po_asm}
      prefixes: {always_join: parity_unit, per_origin: parity_po}

  # Int has a generated assembly and generated contextual registrations. Its
  # checks and entry theories stay hand-written because they carry proofs;
  # `legacy:` names what they publish.
  - name: Int
    # Int's operations carry a refinement mode, so its roles are applications
    # rather than bare names. The published route interprets at the production
    # mode; Int_Entry keeps a mode-generic layer of its own, so the arbitrary-mode
    # API does not narrow.
    adopted: true
    value_type: int_dom
    tag: IntDomValue
    routes: [warrowing_apinis, always_join, per_origin, warrowing_per_origin]
    # Int's operations carry a refinement mode. The unit assembly pins it to
    # the production value because a `global_interpretation` cannot leave a
    # parameter free; the contextual registrations are plain interpretations,
    # so they generalise that pin back to a fixed binder and stay mode-generic.
    # The asymmetry is forced by the emission form, not chosen per domain.
    registrations:
      adopted: true
      # Declared once for the domain, not per context: the rule is that
      # contextual registrations generalise and the unit one pins, which
      # follows from `global_interpretation` being unable to leave a parameter
      # free. Per-context copies would invite one context to disagree with the
      # other about what `Refine_Fixpoint` generalises to.
      generalize: {Refine_Fixpoint: {binder: mode, type: refine_mode}}
      # `published` read off the working file, not inferred. Int publishes a
      # `_for` hop and no `terminates`; Sign publishes a `terminates` and no
      # hop. Neither difference has an external consumer, so unifying them is
      # a deliberate change rather than something generation should decide.
      # Int keeps the hop because `Int_Solver_Analyses` publishes the
      # warrowing half in the same idiom.
      entry_state:
        solvers: [always_join, warrowing_apinis]
        default: warrowing_apinis
        published: [result_for, result, report]
      call_string:
        solvers: [always_join, warrowing_apinis]
        default: warrowing_apinis
        published: [result_for, result, report]
        # `int_cs` is a plain `interpretation` inside the call-string bound's
        # context, so nothing it proves can be reached by name from outside.
        # Naming any re-export here replaces the convention rather than adding
        # to it, so the conventional five are repeated: the sixth, the
        # termination reflection, is what an executable certificate for a
        # call-string configuration needs and the convention does not name.
        re_exports:
          sound: analyse_int_call_string_sound
          sound_of_cover: analyse_int_call_string_sound_of_cover
          sound_of_terminates: analyse_int_call_string_sound_of_terminates
          union_of_cover: analyse_int_call_string_ltr_collect_eq_Union
          gamma_reader: analyse_int_call_string_gamma_reader_eq_lookup
          vars_finite: analyse_int_call_string_vars_finite
          terminates_of_solve_c: int_call_string_terminates_via_solve_c
    # No `checks:` block. `Int_Checks` is not a set of bindings: it proves that the mode-generic `int_conf_*` names agree with
    # the unit assembly at `Refine_Fixpoint` and with the routed pipeline at an
    # arbitrary mode. Those are derivations with proofs, not renamings.
    # No `entry:` block, and Int is the only domain without one. `Int_Entry` is
    # not transport: it re-interprets `unit_dg_analysis` at an
    # arbitrary refinement mode, which the pinned unit assembly cannot, and its
    # check-report bridges go through `classify_checks` by hand because
    # `analyse_int_report_for` reads its table through a surface unfolding
    # rather than through the locale's own report rule. Both are real content,
    # so the theory stays hand-written.
    legacy:
      impl_prefix: int
      # Settled by cutting to the minimum in the hand-written file and letting
      # the session name what broke, not by reasoning about which of the old
      # twenty-one were vestigial. Thirteen were: they served the hand-rolled
      # chains and interpretations the migration deleted. No `Int_Assembly`
      # here -- `Int_Checks` imports it directly rather than through this file.
      ctx_imports:
        - Int_Sound
        - Int_Classify
        - Int_Exec
        - '"Voblint_Result.Routed_Live_Keys"'
        - '"Voblint_Framework.Call_String_Context"'
        - '"Voblint_Framework.Routed_Context"'
        - '"Voblint_Solver.TD_Solver_Bridge"'
        - '"Voblint_VIMP.VIMP_Program"'
        - '"TD.TD_side_upd_rule"'
      classifier: int_classify_check
      init_gamma: int_cinit_gamma
      facts:
        tf_st: {const: int_tf_st_for, args: [Refine_Fixpoint]}
        enter_st: {const: int_dom_enter_st_for, args: [Refine_Fixpoint]}
        init_st: cinit_int_dom_st
        skip: skip_int_dom
        assign: {const: assign_int_dom, args: [Refine_Fixpoint]}
        special: {const: special_int_dom, args: [Refine_Fixpoint]}
        branch: {const: branch_int_dom_for, args: [Refine_Fixpoint]}
        body: body_int_dom
        return: {const: return_int_dom, args: [Refine_Fixpoint]}
        enter_ci: {const: enter_int_dom_ci_for, args: [Refine_Fixpoint]}
        event: event_int_dom
        transfer_sound: int_is_sound_transfer_for
        tf_commute: int_tf_st_for_commute
        tf_abs_def: int_tf_abs_def
        enter_commute: int_dom_enter_st_for_commute
      binders:
        warrowing_apinis: int_warrow_asm
        always_join: int_join_asm
        per_origin: int_po_asm
        warrowing_per_origin: int_wpo_asm
      prefixes:
        warrowing_apinis: int_unit
        always_join: int_join
        per_origin: int_po
        warrowing_per_origin: int_wpo
      # Int is the only domain that still names its reports here. The other
      # four publish them from a generated checks theory; `Int_Checks` is
      # hand-written because it carries proofs rather than bindings, so its
      # spellings are recorded here instead.
      routes:
        warrowing_apinis:
          report: analyse_int_report
          report_with_state: analyse_int_report_with_state
        always_join:
          report: analyse_int_report_join
          report_with_state: int_join.report_with_state
        per_origin:
          report: analyse_int_report_per_origin
          report_with_state: int_per_origin.report_with_state
        warrowing_per_origin:
          report: analyse_int_report_wpo
          report_with_state: int_wpo.report_with_state

  # Congruence publishes on its own, alongside its role as the fourth component
  # of `int_dom`. Its widening is plain join (the modulus only ever coarsens, so
  # an ascending chain is a divisor chain and terminates), which is why it
  # publishes the same two disciplines Sign and Parity do rather than a
  # warrowing route: there is nothing for widening to accelerate.
  - name: Congruence
    adopted: true
    value_type: congruence
    tag: CongruenceValue
    routes: [always_join, per_origin]
    # Which contextual registrations the theory layer carries.
    registrations:
      adopted: true
      entry_state: {solvers: [always_join], default: always_join}
      call_string: {solvers: [always_join], default: always_join}
    checks:
      adopted: true
      ctx_prefix: congruence_conf
      imports:
        - Congruence_Assembly
        - '"Voblint_Framework.Check_Report"'
        - '"Voblint_Result.Analysis_Surface"'
      routes:
        always_join:
          surface: congruence_join_surface
        per_origin:
          surface: congruence_per_origin
          suffix: _per_origin
    entry:
      adopted: true
      routes:
        always_join:
          endpoints: full
          terminates: congruence_conf_terminates_prog
          sol: congruence_conf_sol_prog
          cover: congruence_conf_vars_cover_prog_of_exec
          closure: congruence_closure
          result_for: analyse_congruence_result_for
          report_for: analyse_congruence_report_for
          result: analyse_congruence_result
          report: analyse_congruence_report
    legacy:
      impl_prefix: congruence
      # No `Congruence_Assembly` here, unlike Sign's: `Congruence_Checks` imports it
      # directly, where `Sign_Checks` reaches it only through `Sign_Analyses`.
      # Same rule, different consumer wiring -- the difference is correct.
      # `TD.TD_side_upd_rule` is named though no constant of its appears: the
      # solver obligations are discharged by locale-qualified facts, and a
      # locale-qualified fact does not name its defining theory.
      ctx_imports:
        - Congruence_Sound
        - Congruence_Classify
        - Congruence_Transfer
        - Congruence_Exec
        - '"Voblint_Result.Routed_Live_Keys"'
        - '"Voblint_Framework.Call_String_Context"'
        - '"Voblint_Framework.Routed_Context"'
        - '"Voblint_Solver.TD_Solver_Bridge"'
        - '"Voblint_VIMP.VIMP_Program"'
        - '"TD.TD_side_upd_rule"'
      classifier: congruence_classify_check
      init_gamma: congruence_cinit_gamma
      binders: {always_join: congruence_join, per_origin: congruence_po_asm}
      prefixes: {always_join: congruence_unit, per_origin: congruence_po}
