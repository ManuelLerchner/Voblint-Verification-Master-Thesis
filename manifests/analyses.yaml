# The analysis registry: which verified implementation each analysis domain is.
#
# scripts/gen_analysis_assembly.py turns each entry into
# src/Analyses/<name>/generated/<name>_Analyses.thy, which registers the domain
# at its contexts for every global update rule.
#
# `impl` is the prefix of the domain's own constants and facts (default: the
# lowercased name). `contexts` lists the context policies the domain registers
# on its own (default: `[unit]`; `[]` for none); the CLI runs every domain at
# every policy as a field of the combined state generated into
# src/Executable_Surface/CLI/generated/MCP_Carrier.thy, so a domain registers the
# entry-state or call-string policy only where a theory states facts about it.
# `value_constructor` is its `abstract_value` constructor (default: `<name>Value`),
# `display_type` the type that constructor carries (default: `value_type`), `key`
# the injective key that lists it (default: `<value_type>_key`) and `render` its
# rendering over `$x` (default: `to_string $x`). `field_imports` names the qualified
# theories the combined state imports for the field (default: the domain's own
# generated registration).
# `roles` overrides a role whose spelling does not follow that prefix; a role may
# be an application `{const, args}` for an operation that takes a configuration
# argument. `imports` names the domain's own theories the
# registrations cite. `field` overrides how the domain runs as a field of the
# combined state (FIELD_ROLES in the generator); the defaults are a pointwise
# domain's, and a domain with no registration of its own gives every field role.
# Domain rationale belongs in the domain's README.

domains:
  - name: Sign
    value_type: sign
    imports: [Sign_Sound, Sign_Classify, Sign_Transfer, Sign_Exec]

  - name: Interval
    value_type: ivl
    impl: ivl
    contexts: [unit, entry-state, call-string]
    imports: [Interval_Sound, Interval_Classify, Interval_Transfer, Interval_Exec]

  - name: Parity
    value_type: parity
    imports: [Parity_Sound, Parity_Classify, Parity_Transfer, Parity_Exec]
    roles:
      tf_commute: parity_tf_st_for_commute_if_live

  - name: Int
    value_type: int_dom
    impl: int
    value_constructor: IntDomValue
    imports: [Int_Sound, Int_Classify, Int_Transfer, Int_Exec]
    # Int is registered at its most precise refinement mode.
    roles:
      tf_st: {const: int_tf_st_for, args: [Refine_Fixpoint]}
      enter_st: {const: int_dom_enter_st_for, args: [Refine_Fixpoint]}
      init_st: cinit_int_dom_st
      skip: skip_int_dom
      assign: {const: assign_int_dom, args: [Refine_Fixpoint]}
      special: {const: special_int_dom, args: [Refine_Fixpoint]}
      branch: {const: branch_int_dom_for, args: [Refine_Fixpoint]}
      body: body_int_dom
      return: {const: return_int_dom, args: [Refine_Fixpoint]}
      enter_ci: {const: enter_int_dom_ci_for, args: [Refine_Fixpoint]}
      event: event_int_dom
      transfer_sound: int_is_sound_transfer_for
      tf_commute: int_tf_st_for_commute
      tf_abs_def: int_tf_abs_def
      enter_commute: int_dom_enter_st_for_commute

  - name: Congruence
    value_type: congruence
    imports: [Congruence_Sound, Congruence_Classify, Congruence_Transfer, Congruence_Exec]

  # A relational carrier: no pointwise state and no registration of its own. It
  # answers comparisons from the orders it records and asks at assignments.
  - name: Order
    value_type: relc
    contexts: []
    imports: []
    field_imports: [Voblint_Analysis_Relational.Rel_Order_Local]
    display_type: (vname \<times> vname) list option
    key: order_view_key
    render: order_view_string $x
    field:
      state_type: relc
      published_type: relc
      context_type: unit list
      component: order_component (program_vars $p)
      gamma: gamma_rel $f
      empty: ($f = RelBot)
      read: $f
      published_gamma: gamma_rel $v
      published_empty: ($v = RelBot)
      answer: rel_qry $v $q
      display: Field_Whole (OrderValue (order_pairs $v))
      init: top_relc
      route: "[]"
      context_values: "[]"
      component_sound: order_component_sound
      single_entry: single_entry_order_component
      init_sound: ""
      answer_sound: rel_qry_sound
