# The OCaml packages the analyzer builds with, as conda-forge packages.
#
# Goal: one `pixi install` for the whole repository, so that opam
# (`ocaml-deps-install`, `ocaml/setup-ocaml` in CI) can go. A package counts as
# available when conda-forge publishes it for every platform of
# [workspace].platforms at `version` or later.
#
# `thesis/tools/conda_forge.py --write` asks conda-forge and records the answer
# with its date in thesis/shared/generated/conda-forge.json, which the thesis
# renders as a dependency tree with a checkbox per package. `--check` runs
# offline and fails when the record does not describe exactly this manifest.
#
# [package.<conda name>]
#   opam      the opam package it provides
#   version   the oldest version known to build Voblint
#   tier      build order: a package depends only on lower tiers
#   deps      the packages of this manifest it needs to build or run
#   for       what in the repository needs it (native, browser, format)
#   via       where it is being added, when it is not yet on conda-forge
#
# The order of the entries is the left-to-right order in the thesis figure.

platforms = ["osx-arm64", "osx-64", "linux-64"]

[package.ocaml]
opam = "ocaml"
version = "5.4.0"
tier = 0
deps = []
for = ["native", "browser", "format"]

[package.gmp]
opam = "conf-gmp"
version = "6.3.0"
tier = 0
deps = []
for = ["native"]

[package.binaryen]
opam = "binaryen"
version = "119"
tier = 0
deps = []
for = ["browser"]

[package.ocaml-dune]
opam = "dune"
version = "3.22.0"
tier = 1
deps = ["ocaml"]
for = ["native", "browser", "format"]

[package.ocaml-findlib]
opam = "ocamlfind"
version = "1.9.8"
tier = 1
deps = ["ocaml"]
for = ["native"]
via = "update of ocaml-findlib-feedstock"

[package.ocaml-menhir]
opam = "menhir"
version = "20250912"
tier = 2
deps = ["ocaml-dune"]
for = ["native", "browser", "format"]

[package.ocaml-zarith]
opam = "zarith"
version = "1.14"
tier = 2
deps = ["ocaml-findlib", "gmp"]
for = ["native"]
via = "update of ocaml-zarith-feedstock"

[package.ocaml-zarith-stubs-js]
opam = "zarith_stubs_js"
version = "0.17.0"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "needs an upstream release with the wasm runtime"

[package.ocaml-dune-build-info]
opam = "dune-build-info"
version = "3.22.0"
tier = 2
deps = ["ocaml-dune"]
for = ["format"]
via = "new output of ocaml-dune-feedstock"

[package.ocaml-csexp]
opam = "csexp"
version = "1.5.2"
tier = 2
deps = ["ocaml-dune"]
for = ["format"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-re]
opam = "re"
version = "1.14.0"
tier = 2
deps = ["ocaml-dune"]
for = ["format"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-cmdliner]
opam = "cmdliner"
version = "2.1.1"
tier = 2
deps = ["ocaml-dune"]
for = ["browser", "format"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-yojson]
opam = "yojson"
version = "3.0.0"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-seq]
opam = "seq"
version = "0.3.1"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-sexplib0]
opam = "sexplib0"
version = "0.17.0"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-stdlib-shims]
opam = "stdlib-shims"
version = "0.3.0"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-ppx-derivers]
opam = "ppx_derivers"
version = "1.2.1"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-compiler-libs]
opam = "ocaml-compiler-libs"
version = "0.17.0"
tier = 2
deps = ["ocaml-dune"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-gen]
opam = "gen"
version = "1.1"
tier = 3
deps = ["ocaml-seq"]
for = ["browser"]
via = "conda-forge/staged-recipes#34872"

[package.ocaml-ppxlib]
opam = "ppxlib"
version = "0.38.0"
tier = 3
deps = [
  "ocaml-sexplib0",
  "ocaml-stdlib-shims",
  "ocaml-ppx-derivers",
  "ocaml-compiler-libs",
]
for = ["browser"]

[package.ocaml-sedlex]
opam = "sedlex"
version = "3.7"
tier = 4
deps = ["ocaml-ppxlib", "ocaml-gen"]
for = ["browser"]

[package.ocamlformat]
opam = "ocamlformat"
version = "0.29.0"
tier = 5
deps = [
  "ocaml-csexp",
  "ocaml-cmdliner",
  "ocaml-re",
  "ocaml-menhir",
  "ocaml-dune-build-info",
]
for = ["format"]

[package.ocaml-js-of-ocaml-compiler]
opam = "js_of_ocaml-compiler"
version = "6.4.1"
tier = 5
deps = [
  "ocaml-cmdliner",
  "ocaml-ppxlib",
  "ocaml-sedlex",
  "ocaml-yojson",
  "ocaml-menhir",
]
for = ["browser"]

[package.ocaml-js-of-ocaml]
opam = "js_of_ocaml"
version = "6.4.1"
tier = 6
deps = ["ocaml-js-of-ocaml-compiler"]
for = ["browser"]

[package.ocaml-wasm-of-ocaml-compiler]
opam = "wasm_of_ocaml-compiler"
version = "6.4.1"
tier = 6
deps = ["ocaml-js-of-ocaml-compiler", "binaryen"]
for = ["browser"]
