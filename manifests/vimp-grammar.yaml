# Canonical VIMP source grammar.
#
# This is a *language* description, not a Menhir grammar: precedence and
# associativity are declared once, generically, and each target (Menhir,
# Isabelle syntax, the property-test generator, the printer) is responsible
# for realizing that into its own idiom. In particular this file does not
# introduce `term`/`atom` precedence-tier nonterminals -- those are a
# parser-implementation technique (needed by hand-written recursive descent,
# realizable in Menhir via %left/%right instead), not part of the language.
#
# `program { ... }` is not part of this grammar. A standalone source file is
# EOF-delimited; wrapping VIMP inside a HOL term (the Isabelle
# `program { ... }` quotation) is a target-specific embedding concern,
# hand-written in VIMP_Notation.thy on top of the generated nonterminals.
#
# `main` is not a reserved keyword: VIMP_Notation.thy's parse_translation
# (prog_tr) and the generated Menhir `program` rule both parse every function
# uniformly as an ordinary identifier and pick out "main" by string equality
# afterward (`List.partition (fn (n,_,_,_) => n = "main")` / the OCaml
# equivalent), not via a distinct lexical token.
#
# Locating `main` is nonetheless still done during parsing/lowering here
# (`special: program_structure`), for early, precise parse-time diagnostics
# (missing/duplicate `main`, `main` declared with formals) rather than a deferred
# well-formedness failure. `imp_prog`'s `proc_rep` carries `main` as an
# ordinary entry -- nothing structural forces a `program { ... }`
# construction to include one -- so `wf_source_program`'s own
# `Pi prog_main_name = Some (|formals = [], body = main|)` conjunct is what
# makes "main present, with no formals" a proof obligation on a given
# `imp_prog` value; the parser's checks are a UX convenience on top, not what
# discharges it.
#
# Semantic validation that has no structural encoding (duplicate
# procedure/global/formal names, global/formal collisions, main-return) is not
# part of this grammar. VIMP_Notation.thy's prog_tr checks it at parse time;
# the CLI relies on the well-formedness gate `wf_program_compile_input_exec`.
#
# Every production's AST-construction is exactly one of three shapes:
#
#   lower: {ctor: Name, args: [...]}
#     Structured constructor application. Each entry in `args` is one of:
#       {rhs: N}         -- the parsed value at rhs position N
#       {some: <arg>}    -- that arg wrapped in `Some`
#       {ctor: Name, args: [...]} -- a nested constructor (implicit SKIP)
#       {none: true}     -- literal `None`
#       {literal: true|false} -- a literal boolean
#       {int: N}         -- a literal int (used by exp_true/exp_false to
#         lower straight to N 1/N 0 -- exp has no separate Boolean literal
#         constructor, so a keyword literal still needs a way to reach a
#         fixed integer argument without going through a parsed rhs position)
#       {source_label: true} -- the label of the command being built: the
#         CLI parser writes the (line, column) its first token starts at,
#         the Isabelle notation the placeholder (0, 0). Only stmt_check
#         uses it; the printer drops it, since source text has no label.
#     `{tuple: [i, j, ...]}` builds an OCaml tuple from those rhs positions
#     instead of applying a constructor (function_decl's (name, formals,
#     body), not an algebraic-datatype constructor).
#
#   passthrough: N
#     Transparent syntax: the parsed value at rhs position N, unchanged --
#     grouping parens (exp_paren) and a `global ...;` line's
#     own name list (globals_decl), where the production exists only to
#     constrain what can appear around a value, not to build a new one.
#
#   special: name
#     Genuinely non-generic lowering, hardcoded in the generator (keyed by
#     `name`, not per-production) rather than forced through the structured
#     template above:
#   - integer_literal: converts the lexer's raw OCaml int into the exported
#     Isabelle int representation (Int_of_integer (Z.of_int n)) -- a type
#     conversion, not a constructor application; the only place this is
#     needed, not worth a general conversion mechanism in `lower:` for one
#     call site.
#   - unary minus: folds into N(-n) for a numeral operand, Minus(N 0, x)
#     otherwise. The rule is compositional, with no algebraic
#     simplification at parse time: it deliberately does NOT cancel a nested
#     uminus, so `--x` lowers to `Minus (N 0) (Minus (N 0) (V x))`, not to
#     `x` -- same integer semantics, just not re-simplified during parsing.
#     Both generated frontends realize exactly this rule. Grammar and
#     algebraic normalization are kept as separate concerns; AST
#     normalization, if wanted, belongs in its own explicit pass.
#   - program: partitions the uniformly-parsed function_decl* list into
#     "main" and everything else by string equality (see below).

terminals:
  ident:
    token: IDENT
    lex: "[a-zA-Z_][a-zA-Z0-9_]*"
    excludes_keywords: true
  int_const:
    token: INT
    lex: "[0-9]+"

keywords:
  global: GLOBAL
  fun: FUN
  skip: SKIP
  return: RETURN
  __voblint_check: CHECK
  if: IF
  else: ELSE
  while: WHILE
  "true": BOOL_TRUE
  "false": BOOL_FALSE

punctuation:
  "=": ASSIGN
  "+": PLUS
  "-": MINUS
  "*": STAR
  "/": SLASH
  "%": PERCENT
  "<": LT
  "<=": LE
  ">": GT
  ">=": GE
  "==": EQEQ
  "!=": NEQ
  "&&": AND
  "||": OR
  "!": NOT
  "{": LBRACE
  "}": RBRACE
  "(": LPAREN
  ")": RPAREN
  ";": SEMI
  ",": COMMA

# Lowest to highest binding. Each entry becomes one Menhir %left/%right/
# %nonassoc line, in this order (Menhir's convention: later = binds
# tighter). `UMINUS` is a synthetic precedence level, not a token, used only
# to give the unary-minus production's %prec annotation somewhere to point.
precedence:
  - {assoc: left,  tokens: ["OR"]}
  - {assoc: left,  tokens: ["AND"]}
  - {assoc: none,  tokens: ["EQEQ", "NEQ"]}
  - {assoc: none,  tokens: ["LT", "LE", "GT", "GE"]}
  - {assoc: left,  tokens: ["PLUS", "MINUS"]}
  - {assoc: left,  tokens: ["STAR", "SLASH", "PERCENT"]}
  - {assoc: right, tokens: ["NOT", "UMINUS"]}

productions:
  # -- exp: flat, left-associative via precedence declarations, no term/atom
  # split, and no separate Boolean AST -- comparisons/logical operators are
  # ordinary exp productions that happen to yield 0/1 (see VIMP_Expr.thy's
  # `aval`/`truthy`), not a parallel bexp nonterminal. --
  - {name: exp_var,   result: exp, rhs: [IDENT], lower: {ctor: V, args: [{rhs: 0}]}}
  - {name: exp_num,   result: exp, rhs: [INT],   special: integer_literal}
  - {name: exp_uminus, result: exp, rhs: [MINUS, exp], special: unary_minus, precedence: UMINUS}
  - {name: exp_plus,  result: exp, rhs: [exp, PLUS, exp],  precedence: PLUS,
     lower: {ctor: Plus, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_minus, result: exp, rhs: [exp, MINUS, exp], precedence: MINUS,
     lower: {ctor: Minus, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_times, result: exp, rhs: [exp, STAR, exp],  precedence: STAR,
     lower: {ctor: Times, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_div, result: exp, rhs: [exp, SLASH, exp], precedence: SLASH,
     lower: {ctor: Div, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_mod, result: exp, rhs: [exp, PERCENT, exp], precedence: PERCENT,
     lower: {ctor: Mod, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_true,  result: exp, rhs: [BOOL_TRUE],  lower: {ctor: N, args: [{int: 1}]}}
  - {name: exp_false, result: exp, rhs: [BOOL_FALSE], lower: {ctor: N, args: [{int: 0}]}}
  - {name: exp_less,  result: exp, rhs: [exp, LT, exp],   lower: {ctor: Less, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_less_eq, result: exp, rhs: [exp, LE, exp], lower: {ctor: LessEq, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_greater, result: exp, rhs: [exp, GT, exp], lower: {ctor: Greater, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_greater_eq, result: exp, rhs: [exp, GE, exp], lower: {ctor: GreaterEq, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_eq,    result: exp, rhs: [exp, EQEQ, exp], lower: {ctor: Eq,  args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_not_eq, result: exp, rhs: [exp, NEQ, exp], lower: {ctor: NotEq, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_not,   result: exp, rhs: [NOT, exp], precedence: NOT,
     lower: {ctor: Not, args: [{rhs: 1}]}}
  - {name: exp_and,   result: exp, rhs: [exp, AND, exp], precedence: AND,
     lower: {ctor: And, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: exp_or,    result: exp, rhs: [exp, OR, exp], precedence: OR,
     lower: {ctor: Or, args: [{rhs: 0}, {rhs: 2}]}}
  # Transparent grouping (no AST constructor), so the precedence table alone
  # determines both what a printer must parenthesize and what the
  # property-test generator may produce: any exp tree is
  # source-expressible, not just left-associated ones.
  - {name: exp_paren,  result: exp, rhs: [LPAREN, exp, RPAREN],   passthrough: 1}

  # Simple statements consume SEMI; braced statements need no terminator.
  # A missing else lowers to SKIP, preserving the command AST.
  # -- stmt --
  - {name: stmt_skip,     result: stmt, rhs: [SKIP, SEMI], lower: {ctor: SKIP, args: []}}
  - {name: stmt_assign,   result: stmt, rhs: [IDENT, ASSIGN, exp, SEMI],
     lower: {ctor: Assign, args: [{rhs: 0}, {rhs: 2}]}}
  - {name: stmt_return,   result: stmt, rhs: [RETURN, exp, SEMI],
     lower: {ctor: Return, args: [{some: {rhs: 1}}]}}
  - {name: stmt_return0,  result: stmt, rhs: [RETURN, SEMI],
     lower: {ctor: Return, args: [{none: true}]}}
  - {name: stmt_check,    result: stmt, rhs: [CHECK, LPAREN, exp, RPAREN, SEMI],
     lower: {ctor: Check, args: [{source_label: true}, {rhs: 2}]}}
  - {name: stmt_if,       result: if_stmt, rhs: [IF, LPAREN, exp, RPAREN, LBRACE, stmts_opt, RBRACE, ELSE, LBRACE, stmts_opt, RBRACE],
     lower: {ctor: If, args: [{rhs: 2}, {rhs: 5}, {rhs: 9}]}}
  - {name: stmt_if_then, result: if_stmt, rhs: [IF, LPAREN, exp, RPAREN, LBRACE, stmts_opt, RBRACE],
     lower: {ctor: If, args: [{rhs: 2}, {rhs: 5}, {ctor: SKIP, args: []}]}}
  - {name: stmt_if_chain, result: if_stmt, rhs: [IF, LPAREN, exp, RPAREN, LBRACE, stmts_opt, RBRACE, ELSE, if_stmt],
     lower: {ctor: If, args: [{rhs: 2}, {rhs: 5}, {rhs: 8}]}}
  - {name: stmt_conditional, result: stmt, rhs: [if_stmt], passthrough: 0}
  - {name: stmt_while,    result: stmt, rhs: [WHILE, LPAREN, exp, RPAREN, LBRACE, stmts_opt, RBRACE],
     lower: {ctor: While, args: [{rhs: 2}, {rhs: 5}]}}
  # No separate call0/callret0 (zero-arg) productions: unlike Isabelle's
  # imp2_actuals (which has no empty derivation, forcing _stmt_call0 as a
  # workaround), this grammar's `actuals` already allows `min: 0`, so
  # `f()`/`x = f()` already parse via `stmt_call`/`stmt_callret` with an
  # empty actuals list. A separate call0/callret0 would just be ambiguous
  # with that (confirmed empirically: Menhir reported exactly this as a
  # shift/reduce conflict on RPAREN when both were present).
  - {name: stmt_call,     result: stmt, rhs: [IDENT, LPAREN, actuals, RPAREN, SEMI],
     lower: {ctor: Call, args: [{none: true}, {rhs: 0}, {rhs: 2}]}}
  - {name: stmt_callret,  result: stmt, rhs: [IDENT, ASSIGN, IDENT, LPAREN, actuals, RPAREN, SEMI],
     lower: {ctor: Call, args: [{some: {rhs: 0}}, {rhs: 2}, {rhs: 4}]}}

  # -- statement sequences, actuals, formals, ids: standard left-recursive lists --
  - {name: stmts, result: stmts, list_of: stmt, constructor: Seq, min: 1}
  - {name: stmts_opt, result: stmts_opt, optional_list_of: stmt, constructor: Seq, empty: SKIP}
  - {name: actuals, result: actuals, list_of: exp, separator: COMMA, min: 0}
  - {name: formals, result: formals, list_of: IDENT, separator: COMMA, min: 0}
  - {name: ids,      result: ids,     list_of: IDENT, separator: COMMA, min: 1}

  # -- globals, functions, program --
  - {name: globals_decl, result: globals, rhs: [GLOBAL, ids, SEMI], passthrough: 1}
  - {name: function_decl, result: function, rhs: [FUN, IDENT, LPAREN, formals, RPAREN, LBRACE, stmts_opt, RBRACE],
     lower: {tuple: [1, 3, 6]}}   # (name, formals, body) -- "main" is just an IDENT here, same as every other name

  # Every function parses uniformly via function_decl*; "main" is picked out
  # of the resulting list by string equality during lowering (see this
  # file's header), not by a grammar-level main_decl production.
  - {name: program, result: program, rhs: [globals_opt, function_decl_star, EOF],
     special: program_structure}
