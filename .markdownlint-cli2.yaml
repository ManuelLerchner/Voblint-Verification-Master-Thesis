# `pixi run markdown-lint` runs markdownlint-cli2 with no arguments, so the
# globs below are the whole scope.
globs:
  - "**/*.md"
gitignore: true
ignores:
  - "vendor/**"
  - ".pixi/**"
  - "_build/**"
  - "build/**"
  - "output/**"
  - "node_modules/**"
  - "codegen/generated/**"
  # Written by scripts/extract_definitions.py.
  - "docs/generated/**"
  # Kept verbatim for provenance (docs/history/README.md).
  - "docs/history/**"
  # Symlinks to AGENTS.md, which is linted under its own name.
  - ".claude/CLAUDE.md"
  - ".claude/claude.md"
  - ".claude/worktrees/**"

config:
  # Prose is wrapped by hand where it helps diffs, and tables, URLs and
  # identifiers regularly exceed any fixed width.
  MD013: false
  # README uses GitHub HTML on purpose: banner, <details> blocks, <sub>, <br>.
  MD033: false
  # README opens with its banner image; skills open with YAML front matter.
  MD041: false
  MD004:
    style: dash
  MD048:
    style: backtick
